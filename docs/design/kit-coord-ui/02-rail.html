<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>kit-coord-ui · 02 Mission Log (rail)</title>
<!--
  kit-coord-ui variant 02 — "Mission Log": a vertical timeline rail with glowing nodes.
  Self-contained: inline CSS/JS/SVG, no network assets.
  URL params : ?w=narrow (360px dialog)  ?freeze=1 (no CSS animation, static pose)  ?rm=1 (force reduced-motion look)  ?chrome=0 (hide mock toolbar)
  URL hash   : #idle  #typing  #working  #reply
  Real interaction: type + Enter  ->  working (≈3.6s)  ->  reply + event rows animate in.  Question chips fill the composer.
  Tokens: page/popover/raised/hover/selected/border/input/fg/muted/dim/accent/accent-fg/working/blocked/done are the sibling popup tokens.
  Extensions (this variant only): --placed #6cc4c9 (teal), --decision #b79ae6 (violet), --gutter #858990 (time gutter, AA on --page).
-->
<style>
:root{
  --page:#101214;--popover:#24272b;--raised:#2d3035;--hover:#34373c;--selected:#3b3e44;--border:#44474d;--input:#2a2d31;
  --fg:#e6e7e9;--muted:#9a9ea5;--dim:#6f7379;--accent:#8fa9dc;--accent-fg:#14181f;--working:#e2b94e;--blocked:#ef6a67;--done:#6fcf97;
  --placed:#6cc4c9;--decision:#b79ae6;--gutter:#858990;
  --mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--fg);font:13px/1.5 var(--sans);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}

/* ───────── mock chrome (not part of the design) ───────── */
.mock{flex:none;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:6px 12px;font-size:11px;color:var(--muted);background:#0b0d0f;border-bottom:1px solid #1c1f23}
.mock .lbl{color:var(--dim);text-transform:uppercase;letter-spacing:.08em;font-size:10px}
.mock label{display:inline-flex;gap:4px;align-items:center;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:4px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);font-size:11px;padding:2px 8px;cursor:pointer}
.seg button+button{border-left:1px solid var(--border)}
.seg button[aria-pressed=true]{background:var(--selected);color:var(--fg)}
.mock .run{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:4px;font-size:11px;padding:2px 8px;cursor:pointer}
.stage{flex:1;min-height:0;display:flex;justify-content:center;padding:12px}
body.nochrome .stage{padding:8px}
.narrow .dlg{max-width:360px}

/* ───────── dialog shell (same family as the Board/Timeline popup) ───────── */
.dlg{position:relative;width:100%;max-width:1000px;min-height:0;display:flex;flex-direction:column;gap:10px;padding:14px 16px 12px;background:var(--popover);border:1px solid #33363b;border-radius:8px;container-type:inline-size;container-name:dlg}
.hdr{display:flex;align-items:center;gap:10px;flex:none;min-height:24px;position:relative}
.ttl{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;white-space:nowrap}
.ttl .sub{font:400 11px var(--mono);color:var(--gutter);letter-spacing:.04em}
.stat{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--muted);min-width:0;white-space:nowrap}
.stat .run{display:inline-flex;align-items:center;gap:6px;color:var(--accent)}
.stat .run i{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.stat .short{display:none}
.sp{flex:1}
.ico{width:26px;height:24px;border:1px solid var(--border);border-radius:4px;background:var(--popover);color:var(--muted);cursor:pointer;font-size:15px;line-height:1;display:inline-flex;align-items:center;justify-content:center;padding:0}
.ico:hover,.ico[aria-expanded=true]{background:var(--hover);color:var(--fg)}
.menu{position:absolute;top:30px;right:0;z-index:30;min-width:224px;padding:4px;background:var(--raised);border:1px solid var(--border);border-radius:6px;box-shadow:0 12px 32px rgba(0,0,0,.5)}
.mi{display:flex;width:100%;justify-content:space-between;gap:16px;align-items:center;padding:6px 8px;border:0;background:transparent;border-radius:4px;text-align:left;cursor:pointer;font-size:12.5px}
.mi:hover,.mi:focus-visible{background:var(--hover);outline:none}
.mi small{font-size:11px;color:var(--muted)}
.mi.warn{color:var(--blocked)}
.mn-sep{height:1px;background:var(--border);margin:4px 2px}
.mn-conf{padding:8px;font-size:12px;color:var(--muted)}
.mn-conf b{color:var(--fg);font-weight:600}
.mn-conf .bt{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
.btn{height:24px;padding:0 10px;border:1px solid var(--border);border-radius:4px;background:var(--popover);cursor:pointer;font-size:12px}
.btn.danger{border-color:var(--blocked);color:var(--blocked)}

/* ───────── the log ───────── */
.logwrap{position:relative;flex:1;min-height:0;background:var(--page);border:1px solid #2f3237;border-radius:6px;overflow:hidden}
.logwrap::before{content:"";position:absolute;left:0;right:0;top:0;height:22px;background:linear-gradient(var(--page),rgba(16,18,20,0));z-index:6;pointer-events:none}
.log{position:absolute;inset:0;overflow-y:auto;padding:18px 14px 20px 8px;--gw:50px;--rw:30px;scrollbar-width:thin;scrollbar-color:#3a3d43 transparent;outline:none}
.log:focus-visible{box-shadow:inset 0 0 0 1.5px var(--accent)}
@container dlg (max-width:520px){
  .log{--gw:38px;--rw:24px;padding-right:10px}
  .hdr{flex-wrap:wrap;row-gap:6px}
  .ttl .sub{display:none}
  .stat{order:3;width:100%}
  .stat .long{display:none}.stat .short{display:inline}
  .ftr .r{display:none}
  .send span{display:none}
}
#rows,.row.head{max-width:780px}

.row{position:relative;display:grid;grid-template-columns:var(--gw) minmax(0,1fr);padding-bottom:12px;--c:rgb(var(--rgb))}
.row>.card,.row>.htxt{grid-column:2;margin-left:var(--rw)}
/* rail segment: from this node's centre to the next node's centre, colour-blended */
.row::before{content:"";position:absolute;left:calc(var(--gw) + var(--rw)/2 - 1px);top:15px;bottom:-15px;width:2px;border-radius:1px;z-index:0;
  background:linear-gradient(180deg,rgba(var(--rgb),.6),rgba(var(--nrgb,var(--rgb)),.6))}
.row.head::before{display:none}
.gut{grid-column:1;text-align:right;padding:6px 8px 0 0;font:11px/18px var(--mono);color:var(--gutter);white-space:nowrap}

.k-person{--rgb:230,231,233}
.k-reply{--rgb:143,169,220}
.k-placed{--rgb:108,196,201}
.k-report{--rgb:111,207,151}
.k-progress{--rgb:226,185,78}
.k-question{--rgb:239,106,103}
.k-decision{--rgb:183,154,230}
.row.answered{--rgb:111,207,151}

/* nodes */
.node{position:absolute;left:calc(var(--gw) + var(--rw)/2);top:15px;translate:-50% -50%;width:9px;height:9px;border-radius:50%;background:var(--c);z-index:2;box-shadow:0 0 0 2px var(--page),0 0 11px rgba(var(--rgb),.5)}
.node::after{content:"";position:absolute;inset:-4px;border-radius:inherit;border:1px solid rgba(var(--rgb),.6);opacity:0;pointer-events:none}
.k-reply .node{width:14px;height:14px;box-shadow:0 0 0 2px var(--page),0 0 0 3.5px rgba(var(--rgb),.55),0 0 16px rgba(var(--rgb),.6)}
.k-person .node{rotate:45deg;border-radius:2px;background:var(--page);border:2px solid var(--c);width:10px;height:10px}
.k-placed .node{background:var(--page);border:2px solid var(--c)}
.k-progress .node{width:8px;height:8px;box-shadow:0 0 0 2px var(--page),0 0 8px rgba(var(--rgb),.4)}
.k-decision .node{border-radius:2px;width:8px;height:8px}
.k-question .node{width:12px;height:12px;box-shadow:0 0 0 2px var(--page),0 0 16px rgba(var(--rgb),.7)}
.k-question .node::after{inset:-5px;opacity:.5;animation:qpulse 1.9s ease-out infinite}
.row.answered .node{width:9px;height:9px;box-shadow:0 0 0 2px var(--page),0 0 8px rgba(var(--rgb),.35)}
.row.answered .node::after{display:none}

/* cards */
.card{position:relative;min-width:0;border-radius:6px;padding:7px 10px;background:rgba(255,255,255,.025);border:1px solid #2a2d31}
.card::before{content:"";position:absolute;left:-14px;top:14px;width:14px;height:1px;background:rgba(var(--rgb),.5)}
.card.big{background:var(--raised);border-color:#3b3e44;padding:7px 12px 10px;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.card.me{background:rgba(230,231,233,.05);border-color:rgba(230,231,233,.16)}
.card.ev{padding:6px 10px 7px;background:transparent;border-color:#25282c}
.card.q{background:rgba(239,106,103,.07);border-color:rgba(239,106,103,.42);padding:7px 12px 10px}
.row.answered .card.q{background:transparent;border-color:#2a2d31}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:14px;margin-bottom:3px}
.kind{font:600 10px/14px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--c);white-space:nowrap}
.kind .ans{display:none;color:var(--done)}
.row.answered .kind .ans{display:inline}
.id{font:11px/14px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.card p{margin:0;overflow-wrap:anywhere}
.card.big p{font-size:13.5px;line-height:1.55}
.card.me p{display:flex;gap:8px}
.pr{font:600 13px/1.5 var(--mono);color:var(--accent);flex:none}
b,.mono{font-weight:600}
code{font:12px var(--mono);padding:0 4px;border-radius:3px;background:rgba(143,169,220,.12);color:var(--accent);overflow-wrap:anywhere}
.evl{font-size:12.5px;color:var(--fg);overflow-wrap:anywhere}
.evl .okb{color:var(--done);font-weight:600}
.out{margin-top:2px!important;color:var(--muted);font-size:12.5px}
.out code{color:var(--done);background:rgba(111,207,151,.1)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips.tight{margin-top:5px}
.chip{display:inline-flex;align-items:center;gap:5px;height:20px;max-width:100%;padding:0 8px;border-radius:10px;border:1px solid var(--border);background:var(--input);color:var(--fg);font:11px/18px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip em{font-style:normal;color:var(--muted)}
button.chip{cursor:pointer}
.chip.link{color:var(--accent);border-style:dashed;border-color:rgba(143,169,220,.5);background:transparent}
.chip.link:hover{background:rgba(143,169,220,.14)}
.chip.task{border-color:rgba(108,196,201,.5);color:var(--placed);background:rgba(108,196,201,.08)}
.pips{display:inline-flex;gap:3px;vertical-align:middle;margin-left:8px}
.pips i{width:14px;height:4px;border-radius:2px;background:#3a3d43}
.pips i.on{background:var(--working);box-shadow:0 0 6px rgba(226,185,78,.5)}
.dec{border-left:2px solid rgba(183,154,230,.6);padding-left:8px;margin-top:2px;font-size:12.5px;overflow-wrap:anywhere}

/* question + quick replies */
.qr{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.qrb{height:26px;padding:0 12px;border-radius:13px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:12px;cursor:pointer}
.qrb:hover{background:rgba(143,169,220,.15)}
.qrb.sel{background:var(--accent);color:var(--accent-fg);font-weight:600}
.qhint{margin-top:6px;font-size:11px;color:var(--gutter)}
.qdone{display:none;margin-top:6px;font-size:12px;color:var(--muted)}
.qdone b{color:var(--done)}
.row.answered .qr,.row.answered .qhint{display:none}
.row.answered .qdone{display:block}

/* head: live node at the rail head */
.row.head{padding-bottom:0;min-height:44px}
.row.head[data-s=idle]{--rgb:111,115,121}
.row.head[data-s=work]{--rgb:226,185,78}
.live{position:absolute;left:calc(var(--gw) + var(--rw)/2);top:15px;translate:-50% -50%;width:22px;height:22px;z-index:3}
.live i{position:absolute;display:block;border-radius:50%}
.live .core{inset:7px;background:var(--page);border:2px solid #5d6167;box-shadow:0 0 0 2px var(--page)}
.live .ring{inset:0;border:1px solid rgba(226,185,78,.38);opacity:0}
.live .orbit{inset:0;opacity:0}
.live .orbit::after{content:"";position:absolute;left:50%;top:-2px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--working);box-shadow:0 0 8px 1px rgba(226,185,78,.9)}
.head[data-s=work] .core{background:var(--working);border-color:var(--working);box-shadow:0 0 0 2px var(--page),0 0 14px rgba(226,185,78,.75)}
.head[data-s=work] .ring{opacity:1}
.head[data-s=work] .orbit{opacity:1;animation:spin 2.4s linear infinite}
/* the shimmering rail segment above the live node */
.flow{position:absolute;left:calc(var(--gw) + var(--rw)/2 - 1px);top:-120px;height:135px;width:2px;border-radius:1px;display:none;z-index:1;
  background:linear-gradient(180deg,rgba(226,185,78,0),rgba(226,185,78,.95) 50%,rgba(226,185,78,0)) 0 0/100% 64px repeat-y;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 60%);mask-image:linear-gradient(180deg,transparent,#000 60%);
  filter:drop-shadow(0 0 3px rgba(226,185,78,.55))}
.head[data-s=work] .flow{display:block;animation:flow 3.2s linear infinite}
.head[data-s=work] .gut{color:var(--working)}
.htxt{padding-top:5px;line-height:19px;min-width:0}
.hl{font-size:12.5px;color:var(--gutter)}
.head[data-s=work] .hl{color:var(--working)}
.hs{font:11.5px/17px var(--mono);color:var(--muted);min-height:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hs .st{display:inline-block;animation:stepin .35s ease-out both}
.caret{display:inline-block;width:6px;height:11px;margin-left:3px;vertical-align:-1px;background:var(--working);opacity:.85;animation:blink 1.1s steps(1) infinite}
.head[data-s=idle] .caret{display:none}

/* pending-question pill */
.pill{position:absolute;left:50%;bottom:12px;translate:-50% 0;z-index:8;height:26px;padding:0 12px;border-radius:13px;border:1px solid rgba(239,106,103,.6);background:#2c1f20;color:var(--blocked);font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:0 6px 18px rgba(0,0,0,.5);white-space:nowrap}
.pill:hover{background:#38201f}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}

/* ───────── composer: slim command line ───────── */
.cmp{flex:none;display:flex;flex-direction:column;gap:6px;margin:0}
.ctx{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);padding-left:2px}
.ctx b{color:var(--blocked);font-weight:600}
.ctx .x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:0 4px;border-radius:3px}
.ctx .x:hover{background:var(--hover);color:var(--fg)}
.line{height:36px;display:flex;align-items:center;gap:8px;padding:0 5px 0 12px;border:1px solid var(--border);border-radius:6px;background:var(--input);transition:border-color .15s,box-shadow .15s}
.cmp.on .line,.line:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(143,169,220,.13)}
.pg{font:600 15px/1 var(--mono);color:var(--accent);flex:none;transition:color .2s}
.cmp.busy .pg{color:var(--working)}
#inp{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;color:var(--fg);font:13px var(--sans)}
#inp::placeholder{color:var(--gutter)}
.send{height:26px;padding:0 10px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--gutter);font-size:12px;cursor:default;display:inline-flex;align-items:center;gap:6px;flex:none}
.send span{font-family:var(--mono);opacity:.8}
.send:not(:disabled){background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600;cursor:pointer}
.send:not(:disabled):hover{filter:brightness(1.08)}
.ftr{flex:none;display:flex;justify-content:space-between;gap:12px;font-size:11px;line-height:16px;color:var(--gutter);white-space:nowrap;overflow:hidden}
.ftr .l{overflow:hidden;text-overflow:ellipsis;min-width:0}
.ftr kbd{font:10.5px var(--mono);padding:0 4px;border:1px solid var(--border);border-radius:3px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:1px}

/* ───────── motion ───────── */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flow{to{background-position:0 64px}}
@keyframes qpulse{0%{scale:1;opacity:.65}100%{scale:2.1;opacity:0}}
@keyframes blink{50%{opacity:0}}
@keyframes stepin{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@keyframes rowin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes nodepop{from{scale:.2;opacity:0}to{scale:1;opacity:1}}
@keyframes ripple{0%{scale:1;opacity:.85}100%{scale:2.8;opacity:0}}
@keyframes flash{0%{box-shadow:0 0 0 1px rgba(var(--rgb),.75),0 0 24px rgba(var(--rgb),.28)}100%{box-shadow:0 0 0 1px rgba(var(--rgb),0),0 0 0 rgba(var(--rgb),0)}}
.fresh .card{animation:rowin .46s cubic-bezier(.2,.8,.2,1) both,flash 1.5s ease-out .1s both}
.fresh .node{animation:nodepop .55s cubic-bezier(.2,.9,.3,1.35) .08s both}
.fresh .node::after{animation:ripple 1.1s ease-out .2s both}
.fresh .gut{animation:rowin .46s ease-out both}

/* freeze: deterministic screenshots — everything at its resting pose */
.freeze *,.freeze *::before,.freeze *::after{animation:none!important;transition:none!important}
.freeze .orbit{transform:rotate(38deg)}
.freeze .flow{background-position:0 22px}
.freeze .caret{opacity:.85}

/* reduced motion: no orbit, no shimmer, no pulse, no slide — a static amber ring + text step is the whole indicator */
.rm *,.rm *::before,.rm *::after{animation:none!important;transition:none!important}
.rm .head[data-s=work] .orbit{opacity:0}
.rm .head[data-s=work] .ring{border-width:2px;border-color:rgba(226,185,78,.7)}
.rm .flow{background:linear-gradient(180deg,rgba(226,185,78,0),rgba(226,185,78,.7));filter:none}
.rm .caret{opacity:.85}
.rm .k-question .node::after{opacity:.55;inset:-4px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style></head>
<body>

<div class="mock" id="mock">
  <span class="lbl">state</span>
  <div class="seg" id="segState" role="group" aria-label="Mock state">
    <button type="button" data-s="idle">idle</button><button type="button" data-s="typing">typing</button><button type="button" data-s="working">working</button><button type="button" data-s="reply">reply</button>
  </div>
  <span class="lbl">width</span>
  <div class="seg" id="segW" role="group" aria-label="Mock width">
    <button type="button" data-w="wide">wide</button><button type="button" data-w="narrow">narrow</button>
  </div>
  <label><input type="checkbox" id="cbRm"> reduced motion</label>
  <label><input type="checkbox" id="cbFz"> freeze</label>
  <button type="button" class="run" id="run">▶ send sample</button>
</div>

<div class="stage">
<section class="dlg" aria-label="Coordinator">

  <header class="hdr">
    <div class="ttl">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 1v14" stroke="#44474d" stroke-width="2" stroke-linecap="round"/><circle cx="5" cy="4" r="2.6" fill="#8fa9dc"/><circle cx="5" cy="11" r="1.9" fill="#6cc4c9"/><path d="M8.5 4H14M8.5 11H12" stroke="#6f7379" stroke-width="1.5" stroke-linecap="round"/></svg>
      Coordinator <span class="sub">mission log</span>
    </div>
    <div class="stat" aria-label="Coordinator status">
      <span class="run"><i></i>running</span>
      <span>role model</span>
      <span><span class="long">2 active workstreams</span><span class="short">2 active</span></span>
    </div>
    <span class="sp"></span>
    <button type="button" class="ico" id="menuBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="menu" aria-label="Coordinator actions" title="Coordinator actions">⋯</button>
    <div class="menu" id="menu" role="menu" hidden></div>
  </header>

  <div class="logwrap">
    <div class="log" id="log" role="log" aria-live="polite" aria-relevant="additions" aria-label="Coordinator timeline" tabindex="0">
      <div id="rows"></div>
      <div class="row head" id="head" data-s="idle" aria-live="off">
        <div class="gut" id="hgut">now</div>
        <div class="flow" aria-hidden="true"></div>
        <span class="live" aria-hidden="true"><i class="ring"></i><i class="orbit"></i><i class="core"></i></span>
        <div class="htxt"><div class="hl" id="hl">Coordinator idle · listening</div><div class="hs" id="hs"></div></div>
      </div>
    </div>
    <button type="button" class="pill" id="pill" hidden><i></i>↑ 1 question waiting</button>
  </div>

  <form class="cmp" id="cmp" autocomplete="off" onsubmit="return false">
    <div class="ctx" id="ctx" hidden><span>↳ replying to <b>question</b> · 09:36</span><button type="button" class="x" id="ctxX" aria-label="Drop reply context">×</button></div>
    <div class="line">
      <span class="pg" aria-hidden="true">›</span>
      <input id="inp" type="text" aria-label="Message the coordinator" placeholder="Tell the coordinator…" enterkeyhint="send">
      <button type="button" class="send" id="send" disabled aria-label="Send message">Send<span aria-hidden="true">↵</span></button>
    </div>
  </form>

  <div class="ftr"><span class="l" id="hint"><kbd>Enter</kbd> send · <kbd>Esc</kbd> close</span><span class="r">journal · synced 09:36</span></div>
  <div class="sr" id="sr" role="status" aria-live="polite"></div>
</section>
</div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var q=new URLSearchParams(location.search);
var body=document.body, log=$('#log'), rowsEl=$('#rows'), head=$('#head'), inp=$('#inp'), sendB=$('#send'), cmp=$('#cmp');
var hl=$('#hl'), hs=$('#hs'), hgut=$('#hgut'), pill=$('#pill'), ctx=$('#ctx'), sr=$('#sr'), hint=$('#hint');
var menuBtn=$('#menuBtn'), menu=$('#menu');
var RGB={person:'230,231,233',reply:'143,169,220',placed:'108,196,201',report:'111,207,151',progress:'226,185,78',question:'239,106,103',decision:'183,154,230',idle:'111,115,121',work:'226,185,78'};
var SAMPLE='one more idea: kit-coord-ui instead of seeing the coordinator agent we have a simplified chat input and response timeline - draft a few variants';
var STEPS=['reading the journal','checking checkouts in herdr-kit','choosing a role for the task','placing on a worker'];
var HINT=hint.innerHTML;

var freeze=q.get('freeze')==='1', forceRm=q.get('rm')==='1';
var working=false, replied=false, ctxQ=false, stepI=0, t0=0, clock=9*60+44, timers=[], current='idle';
var rmMQ=window.matchMedia('(prefers-reduced-motion: reduce)');

/* ── mock chrome / env flags ── */
if(q.get('chrome')==='0'){$('#mock').hidden=true;body.classList.add('nochrome')}
function applyEnv(){
  body.classList.toggle('freeze',freeze);
  body.classList.toggle('rm',forceRm||rmMQ.matches);
  $('#cbFz').checked=freeze; $('#cbRm').checked=forceRm||rmMQ.matches;
}
function setWidth(w,push){
  body.classList.toggle('narrow',w==='narrow');
  [].forEach.call($('#segW').children,function(b){b.setAttribute('aria-pressed',String(b.dataset.w===w))});
  if(push){var u=new URL(location.href);if(w==='narrow')u.searchParams.set('w','narrow');else u.searchParams.delete('w');history.replaceState(null,'',u)}
  requestAnimationFrame(checkPill);
}
$('#segW').addEventListener('click',function(e){var b=e.target.closest('button');if(b)setWidth(b.dataset.w,true)});
$('#cbFz').addEventListener('change',function(e){freeze=e.target.checked;applyEnv();if(working)updHead()});
$('#cbRm').addEventListener('change',function(e){forceRm=e.target.checked;applyEnv()});
rmMQ.addEventListener&&rmMQ.addEventListener('change',applyEnv);
$('#segState').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  if(location.hash==='#'+b.dataset.s)setState(b.dataset.s);else location.hash=b.dataset.s});
$('#run').addEventListener('click',function(){setState('typing');timers.push(setTimeout(send,900))});

/* ── row builders ── */
function T(m){m=m%1440;return ('0'+Math.floor(m/60)).slice(-2)+':'+('0'+m%60).slice(-2)}
function R(kind,time,cls,inner,extra){return {kind:kind,time:time,cls:cls,body:inner,extra:extra||''}}
function kindHead(label,id){return '<div class="ch"><span class="kind">'+label+'<span class="ans"> · answered</span></span>'+(id?'<span class="id">'+id+'</span>':'')+'</div>'}
function personRow(text,time){var r=R('person',time,'me',kindHead('You')+'<p><span class="pr" aria-hidden="true">›</span><span></span></p>');r.text=text;return r}
function reply(html,chips,time){return R('reply',time,'big',kindHead('Coordinator','reply')+'<p>'+html+'</p><div class="chips">'+chips+'</div>')}
var C={
  task:function(v){return '<span class="chip task"><em>task</em> '+v+'</span>'},
  kv:function(k,v){return '<span class="chip"><em>'+k+'</em> '+v+'</span>'},
  link:function(k,v,tip){return '<button type="button" class="chip link" data-open="'+tip+'" title="Open '+tip+' (mock)"><em>'+k+'</em> '+v+'</button>'}
};
function placed(time){return R('placed',time,'ev',kindHead('Task placed','ws-pyazfs-t1')+'<div class="chips tight">'+C.task('ws-pyazfs-t1')+'<span aria-hidden="true" style="color:var(--muted)">→</span>'+C.link('tab','t2v','tab t2v')+C.link('space','herdr-kit','space herdr-kit')+C.kv('harness','omp')+C.kv('model','@design')+'</div>')}
function report(time){return R('report',time,'ev',kindHead('Delegate report','ws-p7pfy2')+'<div class="evl"><span class="okb">✓ closed</span> · outcome <b>delivered</b></div><p class="out">coord-design role (omp @design) added, prompt routes UI/UX design to it; <code>011b0de</code> deployed live and verified</p>')}
function progress(time){return R('progress',time,'ev',kindHead('Progress','ws-b04ehc')+'<div class="evl">board overhaul: 3 of 5 popup tests green<span class="pips" role="img" aria-label="3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></span></div>')}
function decision(id,text,time){return R('decision',time,'ev',kindHead('Decision noted',id+' · instruction')+'<div class="dec">'+text+'</div>')}
function question(time){return R('question',time,'q',kindHead('Question','needs you')+
  '<p>The popup edits in <code>mods/herdr-kit-coord</code> are uncommitted on main from another task. Deploy waits for committed HEAD — should I queue the install after they land, or hold until you say go?</p>'+
  '<div class="qr" role="group" aria-label="Quick replies"><button type="button" class="qrb" data-fill="Queue after commit">Queue after commit</button><button type="button" class="qrb" data-fill="Hold">Hold</button></div>'+
  '<div class="qhint">Fills the composer — press Enter to send.</div><div class="qdone"></div>')}
function esc(s){return s.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function rowHtml(r){
  return '<article class="row k-'+r.kind+(r.fresh?' fresh':'')+'" data-kind="'+r.kind+'"><div class="gut"><time datetime="2026-11-13T'+r.time+'">'+r.time+'</time></div><span class="node" aria-hidden="true"></span><div class="card '+r.cls+'">'+r.body+'</div></article>';
}
function hist(){return [
  personRow('UI/UX design tasks should go to a dedicated design role, not coord-deep','09:02'),
  reply('Noted. I’ll add a <b>coord-design</b> role (omp <code>@design</code>) and route UI/UX design work there instead of <code>coord-deep</code>.',C.kv('role','coord-design')+C.kv('harness','omp'),'09:02'),
  decision('i5','UI/UX and visual design work: use role coord-design (omp @design), not coord-deep.','09:03'),
  report('09:19'),
  progress('09:31'),
  question('09:36')
]}

/* ── rendering ── */
function append(r){
  rowsEl.insertAdjacentHTML('beforeend',rowHtml(r));
  var el=rowsEl.lastElementChild;
  if(r.text!==undefined) el.querySelector('.card p span:last-child').textContent=r.text;
  relink();
  return el;
}
function rgbOf(el){return el.classList.contains('answered')?RGB.report:RGB[el.dataset.kind]}
function relink(){
  var k=[].slice.call(rowsEl.children);
  k.forEach(function(el,i){var nx=k[i+1];el.style.setProperty('--nrgb',nx?rgbOf(nx):(working?RGB.work:RGB.idle))});
}
function toEnd(smooth){
  var s=smooth&&!freeze&&!body.classList.contains('rm');
  if(s)log.scrollTo({top:log.scrollHeight,behavior:'smooth'});else log.scrollTop=log.scrollHeight;
}
function checkPill(){
  var qEl=rowsEl.querySelector('.k-question:not(.answered)');
  if(!qEl){pill.hidden=true;return}
  var lr=log.getBoundingClientRect(),qr=qEl.getBoundingClientRect();
  pill.hidden=!(qr.bottom<lr.top+10);
}
function pendingQ(){return !!rowsEl.querySelector('.k-question:not(.answered)')}
function elapsed(){var s=freeze?2:Math.floor((Date.now()-t0)/1000);return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
function updHead(){
  head.dataset.s=working?'work':'idle';
  if(working){
    var i=freeze?1:stepI;
    hl.textContent='Coordinator is working';
    hs.innerHTML='› <span class="st">'+STEPS[i%STEPS.length]+'</span><span class="caret" aria-hidden="true"></span>';
    hgut.textContent=elapsed();
  }else{
    hl.textContent='Coordinator idle · listening';
    hs.textContent=pendingQ()?'1 question is waiting for your answer':'journal is up to date';
    hgut.textContent='now';
  }
  cmp.classList.toggle('busy',working);
  inp.placeholder=working?'Coordinator is working — send unlocks when it replies':'Tell the coordinator…';
  relink(); syncComposer(); markState();
}
function syncComposer(){
  var has=inp.value.trim().length>0;
  cmp.classList.toggle('on',has);
  sendB.disabled=!has||working;
  ctx.hidden=!ctxQ;
}
function markState(){
  current=working?'working':(inp.value.trim()?'typing':(replied?'reply':'idle'));
  [].forEach.call($('#segState').children,function(b){b.setAttribute('aria-pressed',String(b.dataset.s===current))});
}

/* ── working sequence ── */
function clearAll(){timers.forEach(function(t){clearTimeout(t);clearInterval(t)});timers=[]}
function beginWork(done,loop){
  working=true;t0=Date.now();stepI=0;updHead();
  sr.textContent='Coordinator is working';
  if(!freeze){
    timers.push(setInterval(function(){stepI=(stepI+1)%STEPS.length;updHead()},1100));
    timers.push(setInterval(function(){hgut.textContent=elapsed()},250));
  }
  if(!loop)timers.push(setTimeout(done,3600));
}
function finish(r1,evs){
  clearAll();working=false;replied=true;updHead();
  var a=r1;a.fresh=true;append(a);toEnd(true);sr.textContent='Coordinator replied';
  evs.forEach(function(ev,i){timers.push(setTimeout(function(){ev.fresh=true;append(ev);toEnd(true);checkPill()},520*(i+1)))});
  timers.push(setTimeout(checkPill,300));
}
var CANNED={
  place:function(){return {r:reply('Placing this as <b>ws-pyazfs-t1</b> on the design role (omp <code>@design</code>). Reason: mock-only docs in the herdr-kit checkout, no conflict with popup edits in <code>mods/herdr-kit-coord</code>.',C.task('ws-pyazfs-t1')+C.kv('role','coord-design')+C.kv('tab','kit-coord-ui')+C.kv('space','herdr-kit'),T(clock)),evs:[placed(T(clock))]}},
  queue:function(){return {r:reply('Queued. The trusted updater runs from committed <code>main</code> HEAD once the popup edits land — nothing deploys before that.',C.kv('install','queued')+C.kv('space','herdr-kit'),T(clock)),evs:[decision('i6','Deploy waits for committed HEAD: queue the install after the popup edits land.',T(clock))]}},
  hold:function(){return {r:reply('Holding. I won’t install anything until you say go.',C.kv('install','held')+C.kv('space','herdr-kit'),T(clock)),evs:[decision('i6','Hold the install until the person says go.',T(clock))]}}
};
function send(){
  var t=inp.value.trim();if(!t||working)return;
  var which='place';
  if(ctxQ){which=/^hold/i.test(t)?'hold':'queue';markAnswered(t)}
  append(Object.assign(personRow(t,T(clock)),{fresh:true}));
  inp.value='';ctxQ=false;
  clearSel();toEnd(true);
  var c=CANNED[which]();clock+=1;
  beginWork(function(){finish(c.r,c.evs)});
  checkPill();
}
function markAnswered(t){
  var el=rowsEl.querySelector('.k-question:not(.answered)');if(!el)return;
  el.classList.add('answered');
  el.querySelector('.qdone').innerHTML='<b>↳ you answered:</b> '+esc(t)+' · '+T(clock);
  relink();
}
function clearSel(){[].forEach.call(document.querySelectorAll('.qrb.sel'),function(b){b.classList.remove('sel')})}

/* ── states ── */
function reset(){
  clearAll();working=false;replied=false;ctxQ=false;clock=9*60+44;
  rowsEl.innerHTML='';hist().forEach(append);inp.value='';hint.innerHTML=HINT;
}
function setState(s){
  reset();
  if(s==='typing'){inp.value=SAMPLE}
  if(s==='working'){append(personRow(SAMPLE,T(clock)));clock+=1;beginWork(null,true)}
  if(s==='reply'){
    append(personRow(SAMPLE,T(clock)));var c=CANNED.place();clock+=1;
    c.r.fresh=true;append(c.r);c.evs.forEach(function(e){e.fresh=true;append(e)});replied=true;
  }
  updHead();toEnd(false);
  requestAnimationFrame(function(){toEnd(false);checkPill();if(s==='typing')inp.focus({preventScroll:true})});
}
function fromHash(){var h=location.hash.slice(1);setState(/^(idle|typing|working|reply)$/.test(h)?h:'idle')}
window.addEventListener('hashchange',fromHash);

/* ── input / chips / menu ── */
inp.addEventListener('input',function(){syncComposer();markState()});
inp.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.isComposing){e.preventDefault();send()}});
sendB.addEventListener('click',send);
log.addEventListener('scroll',checkPill,{passive:true});
pill.addEventListener('click',function(){var el=rowsEl.querySelector('.k-question:not(.answered)');if(el)el.scrollIntoView({block:'center',behavior:freeze?'auto':'smooth'})});
$('#ctxX').addEventListener('click',function(){ctxQ=false;clearSel();syncComposer();inp.focus()});
log.addEventListener('click',function(e){
  var b=e.target.closest('.qrb');
  if(b){clearSel();b.classList.add('sel');inp.value=b.dataset.fill;ctxQ=true;syncComposer();markState();inp.focus({preventScroll:true});return}
  var o=e.target.closest('[data-open]');if(o)note('Would open '+o.dataset.open+' in Herdr (mock)');
});
var noteT;
function note(m){hint.textContent=m;clearTimeout(noteT);noteT=setTimeout(function(){hint.innerHTML=HINT},2600)}

function menuMain(){menu.innerHTML='<button type="button" class="mi" role="menuitem" data-a="clear">Clear context<small>fresh agent session</small></button><button type="button" class="mi" role="menuitem" data-a="restart">Restart<small>graceful</small></button><div class="mn-sep" role="separator"></div><button type="button" class="mi warn" role="menuitem" data-a="now">Restart now…<small>interrupts the turn</small></button>'}
function menuOpen(o){menu.hidden=!o;menuBtn.setAttribute('aria-expanded',String(o));if(o){menuMain();var f=menu.querySelector('.mi');f&&f.focus()}}
menuBtn.addEventListener('click',function(){menuOpen(menu.hidden)});
menu.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a;
  if(a==='now'){menu.innerHTML='<div class="mn-conf"><b>Restart now?</b><br>This interrupts the coordinator mid-turn. A graceful restart waits for the turn to end.<div class="bt"><button type="button" class="btn" data-a="cancel">Cancel</button><button type="button" class="btn danger" data-a="now!">Restart now</button></div></div>';menu.querySelector('.btn').focus();return}
  if(a==='cancel'){menuMain();menu.querySelector('.mi').focus();return}
  menuOpen(false);menuBtn.focus();
  note(a==='clear'?'Context cleared — fresh coordinator session requested (mock)':a==='restart'?'Graceful restart requested — pending (mock)':'Forced restart requested (mock)');
});
document.addEventListener('click',function(e){if(!menu.hidden&&!e.target.closest('#menu,#menuBtn'))menuOpen(false)});
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape')return;
  if(!menu.hidden){menuOpen(false);menuBtn.focus();return}
  note('Esc closes the popup (mock: no-op)');
});

/* ── boot ── */
applyEnv();setWidth(q.get('w')==='narrow'?'narrow':'wide',false);
if(!location.hash)history.replaceState(null,'',location.href+'#idle');
fromHash();
window.addEventListener('resize',checkPill);
})();
</script>
</body></html>
