<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>kit-coord-ui 03 — Control Room (split)</title>
<script>
/* Root flags are set before first paint: ?freeze=1 ?bare=1 ?rm=1 ?w=narrow|wide ; prefers-reduced-motion => .calm */
(function(){
  var q=new URLSearchParams(location.search), r=document.documentElement;
  if(q.get('freeze')==='1') r.classList.add('freeze');
  if(q.get('bare')==='1') r.classList.add('bare');
  if(q.get('rm')==='1'||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)) r.classList.add('calm');
  var w=q.get('w'); if(w==='narrow'||w==='wide') r.classList.add('w-'+w);
})();
</script>
<style>
:root{
  --page:#101214;--popover:#24272b;--raised:#2d3035;--hover:#34373c;--selected:#3b3e44;--border:#44474d;--input:#2a2d31;
  --fg:#e6e7e9;--muted:#9a9ea5;--dim:#6f7379;--accent:#8fa9dc;--accent-fg:#14181f;--working:#e2b94e;--blocked:#ef6a67;--done:#6fcf97;
  --hair:#33363b;--lilac:#b4a4e6;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"JetBrains Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--fg);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,textarea{font:inherit;color:inherit}
code{font-family:var(--mono)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:1px solid var(--accent);outline-offset:1px}

/* ---------- demo chrome (not part of the product) ---------- */
.page{height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px;gap:8px}
.tools{flex:none;width:100%;max-width:960px;min-height:30px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:11px;color:var(--muted)}
.tools .tt{color:var(--dim);margin-right:auto}
.tg{display:inline-flex;gap:3px;align-items:center}
.tg .tl{margin-right:3px;color:var(--dim)}
.tools button{height:22px;padding:0 8px;border:1px solid var(--border);border-radius:4px;background:var(--popover);color:var(--muted);font-size:11px;cursor:pointer}
.tools button[aria-pressed=true]{background:var(--selected);color:var(--fg);border-color:var(--accent)}
.tools label{display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.bare .tools{display:none}
.stage{flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:center}
.reopen{height:28px;padding:0 12px;border:1px solid var(--border);border-radius:4px;background:var(--popover);cursor:pointer}

/* ---------- dialog shell: same skeleton as the coordinator popup (padding 18, gap 12, footer 28) ---------- */
.dlg{position:relative;container:dlg/inline-size;width:100%;max-width:960px;height:100%;max-height:760px;display:flex;flex-direction:column;gap:12px;padding:18px;background:var(--popover);border:1px solid var(--hair);border-radius:8px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.w-wide .dlg{max-width:960px}
.w-narrow .dlg{max-width:360px;max-height:640px}

.hdr{flex:none;display:flex;align-items:center;gap:8px;min-height:24px}
.h1,.h2{display:contents}
.title{font-weight:600;font-size:15px;white-space:nowrap}
.tabs{display:flex;gap:2px}
.tab{height:22px;padding:0 8px;border-radius:4px;border:0;background:none;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--hover)}
.tab[aria-selected=true]{background:var(--selected);color:var(--fg)}
.sp{flex:1}
#close{order:9}
.chip{display:inline-flex;align-items:center;gap:6px;color:var(--accent);white-space:nowrap}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.chip.working{color:var(--working)}
.chip.working i{animation:blink 1.3s ease-in-out infinite}
.hmeta{color:var(--dim);font-size:11px;white-space:nowrap}
.btn{height:22px;padding:0 8px;border:1px solid var(--border);border-radius:4px;background:var(--popover);font-size:11px;display:inline-flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap;line-height:1;flex:none}
.btn:hover{background:var(--hover)}
.notice{flex:none;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu{position:absolute;z-index:30;min-width:210px;padding:4px;background:var(--raised);border:1px solid var(--border);border-radius:6px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.menu button{display:flex;width:100%;flex-direction:column;align-items:flex-start;gap:0;padding:6px 8px;border:0;border-radius:4px;background:none;text-align:left;cursor:pointer}
.menu button:hover,.menu button:focus-visible{background:var(--hover)}
.menu small{color:var(--dim);font-size:11px}

.ftr{flex:none;height:28px;border-top:1px solid var(--border);padding-top:8px;font-size:11px;line-height:18px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- pill strip (narrow only) ---------- */
.pill{display:none;flex:none;align-items:center;gap:10px;width:100%;min-height:44px;padding:6px 10px;border-radius:6px;background:var(--page);border:1px solid var(--hair);text-align:left;cursor:pointer}
.pill:hover{border-color:var(--border)}
.pill .mini{display:flex;gap:3px;flex:none}
.pill .mini i{width:14px;height:4px;border-radius:2px;background:var(--raised);display:block}
.pill .mini i.done{background:var(--done)}
.pill .mini i.active{background:var(--working);box-shadow:0 0 8px rgba(226,185,78,.5)}
.pill .mini i.skipped{background:var(--border);opacity:.5}
.pill .pcol{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.pill .ptxt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.pill .pcnt{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .pcnt b{color:var(--blocked);font-weight:600}
.pill svg{width:12px;height:12px;flex:none;color:var(--muted);transition:transform .2s}
.sheet-open .pill svg,.pill[aria-expanded=true] svg{transform:rotate(180deg)}

/* ---------- body: two panes ---------- */
.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,400px) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:14px;position:relative}
.chat{display:flex;flex-direction:column;min-width:0;min-height:0}
.log{flex:1;min-height:0;overflow-y:auto;padding:2px 6px 6px 0;display:flex;flex-direction:column;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.log::before{content:"";margin-top:auto}
.item{position:relative;flex:none;--gap:10px;margin-bottom:var(--gap)}
.sess{align-self:center;color:var(--dim);font-size:11px;text-align:center;margin-bottom:6px}
.sep{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:11px;margin:2px 0 12px}
.sep::before,.sep::after{content:"";height:1px;background:var(--hair);flex:1}
.me{align-self:flex-end;max-width:90%;--gap:12px}
.bubble{background:var(--selected);border:1px solid var(--border);padding:7px 11px;border-radius:12px 12px 3px 12px;overflow-wrap:anywhere}
.meta{font-size:11px;color:var(--dim);margin-top:3px}
.me .meta{text-align:right}
.co,.ev,.work{padding-left:32px}
.av{position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:var(--raised);border:1px solid var(--border);color:var(--accent);display:grid;place-items:center}
.av svg{width:13px;height:13px}
.av .ring{display:none;position:absolute;inset:-4px;width:30px;height:30px;color:var(--working)}
.co .who{font-size:11px;color:var(--dim);margin-bottom:2px}
.co .who b{color:var(--fg);font-weight:600}
.co p{margin:0;overflow-wrap:anywhere}
code.i,.co code,.ev code{font-size:12px;background:var(--raised);border:1px solid var(--hair);padding:0 4px;border-radius:3px}
/* the spine: reply and its events hang off one vertical line */
.co::before,.ev::before{content:"";position:absolute;left:10.5px;width:1px;background:var(--border);top:0;bottom:calc(-1*var(--gap))}
.co::before{top:26px}
.co.tail::before{display:none}
.ev.tail::before{bottom:auto;height:16px}
.kc{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border:1px solid var(--border);background:var(--raised);border-radius:11px;font-size:11px;max-width:100%;white-space:nowrap}
.kc em{font-style:normal;color:var(--dim)}
.kc b{font:500 11px var(--mono);overflow:hidden;text-overflow:ellipsis}
button.kc{cursor:pointer}
button.kc:hover{background:var(--hover);border-color:var(--accent)}
.kc.lnk b{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}

.ev .node{position:absolute;left:6px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--popover);border:2px solid var(--k)}
.ev .card{display:block;background:var(--raised);border:1px solid var(--hair);border-left:2px solid var(--k);border-radius:6px;padding:7px 10px;min-width:0}
.ev .e1{display:flex;flex-wrap:wrap;align-items:center;gap:3px 6px;min-width:0}
.ev .e1 svg{width:13px;height:13px;color:var(--k);flex:none}
.ev .e1 b{font-size:12px;font-weight:600;color:var(--k);white-space:nowrap}
.ev .e1 code.c{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ev .e1 time{margin-left:auto;color:var(--dim);font-size:11px;flex:none}
.ev .e2{color:var(--muted);font-size:12px;margin-top:3px;overflow-wrap:anywhere}
.ev .e2 .quote{color:var(--fg)}
.lk{height:18px;padding:0 7px;border:1px solid var(--border);background:none;border-radius:9px;font-size:10.5px;color:var(--muted);cursor:pointer;flex:none;white-space:nowrap;line-height:1}
.lk:hover{color:var(--fg);border-color:var(--accent)}
.il{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;border-bottom:1px dotted var(--accent);line-height:1.2}
.meter{display:inline-flex;gap:2px;vertical-align:middle;margin-right:6px}
.meter i{width:10px;height:4px;border-radius:2px;background:var(--border);display:block}
.meter i.on{background:var(--done)}
.placed{--k:var(--accent)} .done{--k:var(--done)} .decision{--k:var(--lilac)} .progress{--k:var(--working)} .question{--k:var(--blocked)}
.ev.question .card{border-color:rgba(239,106,103,.45);border-left-color:var(--blocked);background:linear-gradient(180deg,rgba(239,106,103,.08),var(--raised) 60%)}
.ev.question.answered .card{border-color:var(--hair);border-left-color:var(--border);background:var(--raised)}
.ev.question.answered .e1 b,.ev.question.answered .e1 svg{color:var(--muted)}
.ev.question.answered .node{border-color:var(--border)}
.qa{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.qbtn{height:26px;padding:0 11px;border-radius:13px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.qbtn:hover{background:var(--accent);color:var(--accent-fg)}
.qdone{margin-top:7px;font-size:12px;color:var(--muted)}
.qdone b{color:var(--done);font-weight:600}

.work{display:flex;align-items:center;min-height:22px;color:var(--muted);font-size:12px;gap:6px;--gap:4px}
.work .av .ring{display:block}
.work b{color:var(--fg);font-weight:600}
.dots{display:inline-flex;gap:2px;margin-left:1px}
.dots i{width:3px;height:3px;border-radius:50%;background:currentColor;display:block;animation:dot 1.2s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}

/* composer */
.comp{flex:none;margin-top:6px}
.field{position:relative;display:flex;align-items:flex-end;gap:6px;min-height:40px;border:1px solid var(--border);background:var(--input);border-radius:8px;padding:4px 4px 4px 12px;overflow:hidden}
.field:focus-within{border-color:var(--accent)}
.field textarea{flex:1;min-width:0;background:none;border:0;outline:0;resize:none;height:30px;max-height:88px;padding:5px 0;line-height:20px;overflow-y:auto}
.field textarea::placeholder{color:var(--dim)}
.send{flex:none;width:30px;height:30px;border-radius:6px;border:0;background:var(--accent);color:var(--accent-fg);cursor:pointer;display:grid;place-items:center}
.send svg{width:15px;height:15px}
.send:disabled{background:var(--raised);color:var(--dim);cursor:default}
.sweep{position:absolute;left:0;top:0;height:2px;width:35%;opacity:0;background:linear-gradient(90deg,transparent,var(--working),transparent)}
.is-working .sweep{opacity:1;animation:sweep 1.6s linear infinite}
.chint{display:flex;gap:8px;margin-top:6px;font-size:11px;color:var(--dim)}
.chint span:last-child{margin-left:auto}

/* ---------- right pane: the control-room panel ---------- */
.panel{min-width:0;min-height:0;display:flex;flex-direction:column;background-color:var(--page);background-image:radial-gradient(rgba(230,231,233,.05) 1px,transparent 1px);background-size:14px 14px;border:1px solid var(--hair);border-radius:8px;overflow:hidden}
.ph{flex:none;display:flex;align-items:center;gap:8px;padding:12px 14px 0;min-width:0}
.ptitle{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pstate{font-size:12px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.led{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.led.on{background:var(--working);box-shadow:0 0 8px var(--working);animation:blink 1.3s ease-in-out infinite}
.led.ok{background:var(--done)}
.stepper{flex:none;padding:12px 14px 0}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.bar{position:relative;height:5px;border-radius:3px;background:var(--raised);overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px}
.step.done .fill{background:var(--done)}
.step.active .bar{box-shadow:0 0 10px rgba(226,185,78,.35)}
.step.active .fill{background:linear-gradient(100deg,var(--working) 0 40%,#fff0b8 50%,var(--working) 60% 100%);background-size:200% 100%;animation:sheen 1.3s linear infinite}
.step.skipped .bar{background:repeating-linear-gradient(90deg,var(--border) 0 3px,transparent 3px 6px);opacity:.55}
.lbl{display:flex;align-items:flex-start;gap:5px;margin-top:7px;font-size:12px;line-height:1.25;color:var(--dim)}
.n{flex:none;width:15px;height:15px;border-radius:50%;border:1px solid var(--border);font-size:9.5px;display:grid;place-items:center;line-height:1}
.step.active .lbl{color:var(--fg);font-weight:600}
.step.active .n{border-color:var(--working);color:var(--working)}
.step.done .lbl{color:var(--muted)}
.step.done .n{background:var(--done);border-color:var(--done);color:var(--accent-fg)}
.step.skipped .lbl{color:var(--dim);text-decoration:line-through}
.sub{margin:3px 0 0 20px;font-size:11px;color:var(--dim)}
.step.active .sub{color:var(--muted)}
.act{flex:none;margin:10px 14px 0;padding:7px 10px;border-radius:6px;background:rgba(0,0,0,.3);border:1px solid var(--hair);font:11.5px/1.45 var(--mono);color:var(--muted);display:flex;gap:8px;min-height:36px}
.act .pr{color:var(--accent);flex:none}
.act .t{overflow-wrap:anywhere;min-width:0}
.act.swap .t{animation:fadeIn .35s ease-out}
.lh{flex:none;display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:14px 14px 6px;font-size:11px;color:var(--muted)}
.lh b{font-weight:600;letter-spacing:.02em}
.lh span b{color:var(--blocked)}
.lanes{list-style:none;margin:0;padding:0 10px 12px;overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.sechd{flex:none;font-size:11px;color:var(--dim);padding:6px 4px 0}
.lane{position:relative;flex:none;padding:9px 12px 9px 16px;border-radius:6px;background:var(--raised);border:1px solid var(--hair);overflow:hidden;transition:background .2s}
.lane.rel{background:var(--selected)}
.lane .edge{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--lc,var(--border))}
.lane.running{--lc:var(--working)} .lane.asks{--lc:var(--blocked)} .lane.placing{--lc:var(--accent)} .lane.done{--lc:var(--done)}
.lane.active{background:linear-gradient(90deg,color-mix(in srgb,var(--lc) 12%,var(--raised)),var(--raised) 70%)}
.lane.active .edge{animation:edge 1.5s ease-in-out infinite;box-shadow:0 0 12px var(--lc)}
.lane.ghost{background:transparent;border-style:dashed;border-color:var(--border)}
.lane.ghost .edge{background:repeating-linear-gradient(var(--accent) 0 4px,transparent 4px 7px)}
.lane.compact{padding:6px 12px 6px 16px;opacity:.82}
.lane.fresh{animation:laneIn .5s var(--ease) both}
.lane.changed{animation:changed 1.1s ease-out}
.lane.flash,.card.flash{animation:ring 1.4s ease-out;outline:1px solid var(--accent)}
.l1{display:flex;align-items:baseline;gap:8px;min-width:0}
.lt{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lid{font-size:11px;color:var(--dim);flex:none}
.lst{margin-left:auto;flex:none;font-size:11px;color:var(--lc)}
.ck{color:var(--done);flex:none;font-size:12px}
.l2{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tchip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:10px;background:var(--page);border:1px solid var(--hair);font-size:11px;max-width:100%;white-space:nowrap}
.tchip i{width:6px;height:6px;border-radius:50%;background:var(--tc);display:block;flex:none}
.tchip code{font-size:11px;overflow:hidden;text-overflow:ellipsis}
.tchip em{font-style:normal;color:var(--muted)}
.l3{margin-top:6px;font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:3px 10px;align-items:center;min-width:0;overflow-wrap:anywhere}
.lane.compact .l3{margin-top:2px}
.l4{margin-top:3px;font-size:11.5px;color:var(--muted)}
.sk{display:block;height:8px;width:62%;border-radius:4px;background:linear-gradient(90deg,var(--raised),var(--hover),var(--raised));background-size:200% 100%;animation:sheen 1.4s linear infinite}
.ask{margin-top:8px;padding:6px 8px;border-radius:5px;background:rgba(239,106,103,.1);border:1px solid rgba(239,106,103,.35);font-size:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ask b{color:var(--blocked);font-weight:600}
.ask .lk{margin-left:auto}
.sclose{display:none}
.scrim{display:none}

/* ---------- narrow: panel becomes pill strip + sheet (content width < 640 popup breakpoint) ---------- */
@container dlg (max-width:602px){
  .hdr{flex-direction:column;align-items:stretch}
  .h1,.h2{display:flex;align-items:center;gap:8px}
  #close{order:0}
  #menubtn{margin-left:auto}
  .pill{display:flex}
  .body{grid-template-columns:minmax(0,1fr)}
  .panel{position:absolute;left:0;right:0;top:0;max-height:calc(100% - 4px);z-index:6;display:none;border-color:var(--border);box-shadow:0 18px 40px rgba(0,0,0,.6)}
  .sheet-open .panel{display:flex;animation:sheetIn .28s var(--ease)}
  .sheet-open .scrim{display:block;position:absolute;inset:0;z-index:5;background:rgba(16,18,20,.62);border-radius:6px;border:0;cursor:pointer}
  .sclose{display:block;flex:none;margin:0;width:100%;height:30px;border:0;border-top:1px solid var(--hair);background:rgba(0,0,0,.25);color:var(--muted);cursor:pointer;font-size:11px}
  .sclose:hover{color:var(--fg)}
  .sub{display:none}
  .ftr .x{display:none}
  .chint span:last-child{display:none}
  .ev .e1 time{display:none}
}

/* ---------- motion ---------- */
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
@keyframes sheen{from{background-position:100% 0}to{background-position:0 0}}
@keyframes edge{0%,100%{opacity:1}50%{opacity:.3;box-shadow:none}}
@keyframes enter{from{opacity:0;transform:translateY(8px)}}
@keyframes evIn{from{opacity:0;transform:translateX(-8px)}}
@keyframes ping{0%{box-shadow:0 0 0 0 var(--k)}100%{box-shadow:0 0 0 9px transparent}}
@keyframes laneIn{from{opacity:0;transform:translateY(-10px) scale(.98)}}
@keyframes changed{0%{background:color-mix(in srgb,var(--lc,#8fa9dc) 28%,var(--raised))}100%{background:var(--raised)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(143,169,220,.85)}100%{box-shadow:0 0 0 8px rgba(143,169,220,0)}}
@keyframes sheetIn{from{opacity:0;transform:translateY(-8px)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.av .ring{animation:spin 3s linear infinite}
.item.enter{animation:enter .38s var(--ease) both}
.ev.enter{animation:evIn .42s var(--ease) both}
.ev.enter .node{animation:ping .9s ease-out}

/* reduced-motion + freeze: no animation or transition at all; state is carried by text, shape and colour */
:root.calm *,:root.calm *::before,:root.calm *::after,
:root.freeze *,:root.freeze *::before,:root.freeze *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
:root.calm .step.active .fill{background:var(--working)}
:root.freeze .step.active .fill{background-position:50% 0}
:root.calm .step.active .bar{outline:1px solid var(--working);outline-offset:1px}
:root.calm .lane.active .edge{opacity:1}
:root.calm .lane.active{outline:1px solid color-mix(in srgb,var(--lc) 55%,transparent)}
:root.calm .sweep{display:none}
:root.calm .av .ring{display:none}
:root.freeze .sweep{left:20%}
</style></head>
<body>
<div class="page">
  <div class="tools" role="toolbar" aria-label="Mock controls (not part of the product)">
    <span class="tt">kit-coord-ui · 03 Control Room · mock</span>
    <span class="tg" role="group" aria-label="State"><span class="tl">State</span>
      <button type="button" data-s="idle">idle</button><button type="button" data-s="typing">typing</button><button type="button" data-s="working">working</button><button type="button" data-s="reply">reply</button></span>
    <span class="tg" role="group" aria-label="Width"><span class="tl">Width</span>
      <button type="button" data-w="auto">auto</button><button type="button" data-w="wide">wide</button><button type="button" data-w="narrow">narrow</button></span>
    <label class="tg"><input type="checkbox" id="rm"> reduce motion</label>
  </div>
  <div class="stage">
    <button type="button" class="reopen" id="reopen" hidden>Dialog closed (Esc). Reopen</button>
    <div class="dlg" id="dlg" role="dialog" aria-label="Coordinator">

          <span class="sp"></span>
          <button type="button" class="btn" id="close">Close</button>

          <button type="button" class="btn" id="menubtn" aria-haspopup="menu" aria-expanded="false">Coordinator &#8943;</button>
        </div>
      </header>
      <div class="notice" id="notice" role="status" hidden></div>
      <button type="button" class="pill" id="pill" aria-expanded="false" aria-controls="panel">
        <span class="mini" id="mini" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="pcol"><span class="ptxt" id="ptxt">Idle · standing by</span>
        <span class="pcnt" id="pcnt"></span></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="body" id="body">
        <section class="chat" aria-label="Conversation with the coordinator">
          <div class="log" id="log" role="log" aria-live="off" tabindex="0" aria-label="Coordinator conversation and events"></div>
          <form class="comp" id="comp" autocomplete="off">
            <div class="field">
              <span class="sweep" aria-hidden="true"></span>
              <textarea id="inp" rows="1" aria-label="Message to the coordinator" placeholder="Message the coordinator"></textarea>
              <button type="submit" class="send" id="send" aria-label="Send message" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V6M6 11l6-6 6 6"/></svg>
              </button>
            </div>
            <div class="chint"><span id="chintL">Goes to the coordinator agent</span><span>Enter sends</span></div>
          </form>
        </section>
        <button type="button" class="scrim" id="scrim" tabindex="-1" aria-label="Hide panel"></button>
        <aside class="panel" id="panel" aria-label="What the coordinator is doing now">
          <div class="ph"><span class="led" id="led"></span><span class="ptitle">Now</span><span class="pstate" id="pstate">Standing by</span></div>
          <div class="stepper" id="stepper" role="group" aria-label="Coordinator turn progress"><ol class="steps" id="steps" style="list-style:none"></ol></div>
          <div class="act" id="act" aria-live="off"></div>

      </div>
      <div class="ftr"><span>Enter send &nbsp; Esc close</span><span class="x"> &nbsp;·&nbsp; a window onto the coordinator journal, seq 4821</span></div>
      <div class="menu" id="menu" role="menu" aria-label="Coordinator actions" hidden>
        <button type="button" role="menuitem" data-m="clear">Clear context<small>Fresh agent session when idle</small></button>
        <button type="button" role="menuitem" data-m="restart">Restart coordinator<small>Graceful; waits for the current turn</small></button>
        <button type="button" role="menuitem" data-m="show">Show coordinator terminal<small>The raw agent, for debugging</small></button>
      </div>
    </div>
  </div>
</div>
<div class="vh" id="live" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var root=document.documentElement;
var frozen=root.classList.contains('freeze');
var isCalm=function(){return root.classList.contains('calm')};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var md=function(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')};

var dlg=$('#dlg'),log=$('#log'),inp=$('#inp'),send=$('#send'),body=$('#body'),pill=$('#pill');
var stepsEl=$('#steps'),stepper=$('#stepper'),actEl=$('#act'),lanesEl=$('#lanes');

var SAMPLE='one more idea: kit-coord-ui instead of seeing the coordinator agent we have a simplified chat input and response timeline - draft a few variants';
var QTXT='The popup edits in `mods/herdr-kit-coord` are uncommitted on main from another task. Deploy waits for committed HEAD \u2014 should I queue the install after they land, or hold until you say go?';
var MAINREPLY='Placing this as **ws-pyazfs-t1** on the design role (omp @design). Reason: mock-only docs in the herdr-kit checkout, no conflict with popup edits in `mods/herdr-kit-coord`.';

var ICON={
  placed:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h11M11 7l5 5-5 5M20 5v14"/></svg>',
  done:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  decision:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v17M7 5h10l-2 4 2 4H7"/></svg>',
  progress:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg>',
  question:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 015 .5c0 1.5-2.5 2-2.5 3.5M12 17h.01"/></svg>'
};
var HEX='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3l7.8 4.5v9L12 21l-7.8-4.5v-9z"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/></svg>';
var RING='<svg class="ring" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="15" cy="15" r="13.5" stroke-dasharray="14 71"/></svg>';

var PHASES=[
  {name:'Reading inbox',sub:'journal \u00b7 reports'},
  {name:'Choosing placement',sub:'role \u00b7 rung \u00b7 tab'},
  {name:'Starting delegate',sub:'harness \u00b7 model'}
];

/* ---------- state ---------- */
var S={working:false,turn:0,timers:[],mainDone:false,sheet:false,anim:true,phaseIdx:-1};
var lanes=[];
function mkLanes(){return [
  {key:'ws-k3m2ab',title:'Board overhaul',state:'running',born:1,tasks:[{id:'ws-k3m2ab-t1',st:'running',label:'running'}],meter:[3,5],meterTxt:'3 of 5 popup tests green',meta:['tab t5f','space herdr-kit','omp @deep']},
  {key:'ws-p7pfy2',title:'coord-design role',state:'running',born:2,tasks:[{id:'ws-p7pfy2-t1',st:'running',label:'running'}],note:'adding role and prompt routing',meta:['tab t3c','space herdr-kit','omp @design']}
];}
function lane(k){for(var i=0;i<lanes.length;i++){if(lanes[i].key===k)return lanes[i]}return null}

/* ---------- helpers ---------- */
function notify(msg){
  var n=$('#notice'); n.textContent=msg; n.hidden=false;
  clearTimeout(notify.t); notify.t=setTimeout(function(){n.hidden=true},4200);
}
function say(msg){$('#live').textContent=msg}
function narrow(){return pill.offsetParent!==null}
function scrollEnd(smooth){
  log.scrollTop=log.scrollHeight;
  requestAnimationFrame(function(){log.scrollTo({top:log.scrollHeight,behavior:(smooth&&!isCalm()&&!frozen)?'smooth':'auto'})});
}
function setTimer(ms,fn,id){S.timers.push(setTimeout(function(){if(S.turn===id)fn()},ms))}

/* ---------- log items ---------- */
function retail(){
  var items=[].filter.call(log.children,function(e){return e.classList.contains('item')});
  items.forEach(function(e,i){
    var n=items[i+1];
    var thread=e.classList.contains('co')||e.classList.contains('ev');
    var cont=n&&(n.classList.contains('ev')||n.classList.contains('co'));
    e.classList.toggle('tail',thread&&!cont);
  });
}
function put(el,smooth){
  el.classList.add('item');
  if(S.anim) el.classList.add('enter');
  var w=$('#workrow');
  if(w&&el.id!=='workrow') log.insertBefore(el,w); else log.appendChild(el);
  retail(); scrollEnd(smooth&&S.anim);
  return el;
}
function mk(cls,html){var d=document.createElement('div');d.className=cls;d.innerHTML=html;return d}
function addSess(){put(mk('sess','coordinator session since 09:12 \u00b7 journal seq 4821'))}
function addSep(t){put(mk('sep','<span>'+esc(t)+'</span>'))}
function addMe(text,time){put(mk('me','<div class="bubble">'+esc(text)+'</div><div class="meta">You \u00b7 '+time+'</div>'),true)}
function chipHtml(c){
  var k=c[0],v=c[1],o=c[2]||'',inner='<em>'+esc(k)+'</em><b>'+esc(v)+'</b>';
  if(o.indexOf('lane:')===0) return '<button type="button" class="kc lnk" data-lane="'+o.slice(5)+'" title="Highlight this workstream lane">'+inner+'</button>';
  if(o==='link') return '<button type="button" class="kc lnk" data-go="'+esc(k+' '+v)+'" title="Would focus this '+esc(k)+'">'+inner+'</button>';
  return '<span class="kc">'+inner+'</span>';
}
function addCo(o){
  var chips=o.chips?'<div class="chips">'+o.chips.map(chipHtml).join('')+'</div>':'';
  return put(mk('co','<span class="av">'+HEX+'</span><div class="who"><b>Coordinator</b> \u00b7 '+o.time+'</div><p>'+md(o.text)+'</p>'+chips),true);
}
function addEv(o){
  var lk=o.lane?'<button type="button" class="lk" data-lane="'+o.lane+'" aria-label="Show lane '+o.lane+'">lane \u2197</button>':'';
  var h='<span class="node" aria-hidden="true"></span><article class="card" aria-label="'+esc(o.label)+'"><div class="e1">'+ICON[o.kind]+'<b>'+esc(o.label)+'</b>'+(o.code?'<code class="c">'+esc(o.code)+'</code>':'')+lk+'<time>'+o.time+'</time></div><div class="e2">'+o.body+'</div>'+(o.extra||'')+'</article>';
  var el=mk('ev '+o.kind,h);
  if(o.lane) el.setAttribute('data-rel',o.lane);
  return put(el,true);
}
function il(v){return '<button type="button" class="il" data-go="'+esc(v)+'">'+esc(v)+'</button>'}
function meterHtml(a,b){var s='';for(var i=0;i<b;i++)s+='<i'+(i<a?' class="on"':'')+'></i>';return '<span class="meter" role="img" aria-label="'+a+' of '+b+'">'+s+'</span>'}

var EV={
  placedK3:function(){return {kind:'placed',label:'Task placed',code:'ws-k3m2ab-t1',lane:'ws-k3m2ab',time:'13:41',body:'\u2192 '+il('tab t5f')+' in '+il('space herdr-kit')+' \u00b7 omp \u00b7 @deep'}},
  progressK3:function(){return {kind:'progress',label:'Delegate progress',code:'ws-k3m2ab-t1',lane:'ws-k3m2ab',time:'14:12',body:meterHtml(3,5)+'board overhaul: 3 of 5 popup tests green'}},
  placedPy:function(){return {kind:'placed',label:'Task placed',code:'ws-pyazfs-t1',lane:'ws-pyazfs',time:'14:21',body:'\u2192 '+il('tab t2v')+' in '+il('space herdr-kit')+' \u00b7 omp \u00b7 @design'}},
  donaP7:function(){return {kind:'done',label:'Delegate done',code:'ws-p7pfy2',lane:'ws-p7pfy2',time:'14:21',body:'closed \u00b7 outcome <b style="color:var(--done)">delivered</b><div class="quote">\u201ccoord-design role (omp @design) added, prompt routes UI/UX design to it; <code class="c">011b0de</code> deployed live and verified\u201d</div>'}},
  decision:function(){return {kind:'decision',label:'Decision noted',code:'i5',time:'14:21',body:'UI/UX and visual design work: use role <code class="c">coord-design</code> (omp @design), not <code class="c">coord-deep</code>.'}},
  question:function(){return {kind:'question',label:'Needs you',lane:'ws-k3m2ab',time:'14:21',body:'<span style="color:var(--fg)">'+md(QTXT)+'</span>',extra:'<div class="qa"><button type="button" class="qbtn" data-q="queue">Queue after commit</button><button type="button" class="qbtn" data-q="hold">Hold</button></div>'}}
};

function buildHistory(){
  addSess(); addSep('Today');
  addMe('overhaul the board popup: attention items first, retained workstreams last','13:41');
  addCo({time:'13:41',text:'Placing this as **ws-k3m2ab-t1** on the deep role (omp @deep) in a new worktree. Reason: touches `mods/herdr-kit-coord` and needs the popup tests.',chips:[['task','ws-k3m2ab-t1','lane:ws-k3m2ab'],['role','coord-deep'],['tab','t5f','link'],['space','herdr-kit','link']]});
  addEv(EV.placedK3());
  addEv(EV.progressK3());
}

/* ---------- work row ---------- */
function showWork(on,txt){
  var w=$('#workrow');
  if(!on){if(w)w.remove();retail();return}
  if(!w){
    w=mk('item work','<span class="av">'+HEX+RING+'</span><span><b>Coordinator</b> <span id="wphase"></span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></span>');
    w.id='workrow'; w.setAttribute('aria-hidden','true');
    put(w,true);
  }
  $('#wphase').textContent=txt.toLowerCase();
}

/* ---------- stepper / panel ---------- */
function buildSteps(){
  stepsEl.innerHTML=PHASES.map(function(p,i){
    return '<li class="step pending"><div class="bar"><i class="fill"></i></div><div class="lbl"><span class="n">'+(i+1)+'</span><span class="nm">'+p.name+'</span><span class="vh st">pending</span></div><div class="sub">'+p.sub+'</div></li>';
  }).join('');
}
var STWORD={pending:'pending',active:'in progress',done:'done',skipped:'skipped'};
function setSteps(states,o){
  o=o||{};
  stepper.classList.toggle('rest',states.every(function(s){return s==='pending'}));
  var instant=isCalm()||frozen;
  [].forEach.call(stepsEl.children,function(el,i){
    var s=states[i]||'pending', f=el.querySelector('.fill');
    el.className='step '+s;
    if(s==='active')el.setAttribute('aria-current','step');else el.removeAttribute('aria-current');
    el.querySelector('.n').textContent=s==='done'?'\u2713':s==='skipped'?'\u2013':String(i+1);
    el.querySelector('.st').textContent=STWORD[s];
    f.style.transition='none';
    if(s==='active'){
      f.style.width='0%';
      if(o.p!=null||instant){f.style.width=(o.p!=null?o.p:50)+'%'}
      else{void f.offsetWidth;f.style.transition='width '+o.dur+'ms linear';f.style.width='100%'}
    }else f.style.width=s==='done'?'100%':'0%';
  });
  [].forEach.call($('#mini').children,function(el,i){el.className=states[i]||''});
}
function setAct(text){
  actEl.innerHTML='<span class="pr">\u203a</span><span class="t"></span>';
  actEl.querySelector('.t').textContent=text;
  actEl.classList.remove('swap'); void actEl.offsetWidth; actEl.classList.add('swap');
}
function setPstate(text,led){
  $('#pstate').textContent=text; $('#ptxt').textContent=text;
  var l=$('#led'); l.className='led'+(led?' '+led:'');
}
function paintWorking(){
  dlg.classList.toggle('is-working',S.working);
  $('#chip').classList.toggle('working',S.working);
  $('#chiptxt').textContent=S.working?'Working':'Running';
  $('#chintL').textContent=S.working?'Working \u2014 you can keep typing':'Goes to the coordinator agent';
  inp.placeholder=S.working?'Coordinator is working\u2026':'Message the coordinator';
  updateSend();
}

/* ---------- lanes ---------- */
var TC={running:'var(--working)',placing:'var(--accent)',starting:'var(--accent)',delivered:'var(--done)'};
function laneHtml(l){
  var kind=l.state==='asks'?'asks':l.state==='done'?'done':l.state==='placing'?'placing':'running';
  var stTxt={running:'running',asks:'needs you',placing:'placing\u2026',starting:'starting\u2026',done:'delivered'}[l.state];
  var cls=['lane',kind,l.ghost?'ghost':'',l.active?'active':'',l.fresh?'fresh':'',l.changed?'changed':'',l.state==='done'?'compact':''].filter(Boolean).join(' ');
  var h='<li class="'+cls+'" id="lane-'+l.key+'" tabindex="-1"><span class="edge"></span>';
  h+='<div class="l1">'+(l.state==='done'?'<span class="ck" aria-hidden="true">\u2713</span>':'')+'<span class="lt">'+esc(l.title)+'</span><code class="lid">'+esc(l.key)+'</code><span class="lst">'+stTxt+'</span></div>';
  if(l.state==='done'){
    h+='<div class="l3">'+esc(l.outcome)+'</div>';
  }else{
    h+='<div class="l2">'+l.tasks.map(function(t){return '<span class="tchip" style="--tc:'+TC[t.st]+'"><i></i><code>'+t.id+'</code><em>'+t.label+'</em></span>'}).join('')+'</div>';
    h+='<div class="l3">';
    if(l.skeleton)h+='<span class="sk" aria-hidden="true"></span>';
    else{
      if(l.meter)h+='<span>'+meterHtml(l.meter[0],l.meter[1])+esc(l.meterTxt)+'</span>';
      if(l.meta)h+='<span>'+l.meta.map(esc).join(' \u00b7 ')+'</span>';
    }
    h+='</div>';
    if(l.note)h+='<div class="l4">'+esc(l.note)+'</div>';
    if(l.state==='asks')h+='<div class="ask"><b>Needs you</b><span>Deploy waits for committed HEAD</span><button type="button" class="lk" data-jump="question">see question \u2199</button></div>';
  }
  return h+'</li>';
}
function renderLanes(){
  var act=lanes.filter(function(l){return l.state!=='done'});
  var closed=lanes.filter(function(l){return l.state==='done'});
  act.sort(function(a,b){var ra=a.state==='asks'?0:1,rb=b.state==='asks'?0:1;return ra-rb||b.born-a.born});
  var h=act.map(laneHtml).join('');
  if(closed.length)h+='<li class="sechd">Closed today \u00b7 '+closed.length+'</li>'+closed.map(laneHtml).join('');
  lanesEl.innerHTML=h;
  lanes.forEach(function(l){l.fresh=false;l.changed=false});
  var nA=lanes.filter(function(l){return l.state!=='done'&&!l.ghost}).length;
  var nN=lanes.filter(function(l){return l.state==='asks'}).length;
  $('#lcount').innerHTML=nA+' active'+(nN?' \u00b7 <b>'+nN+' needs you</b>':'');
  $('#pcnt').innerHTML=nA+' active'+(nN?' \u00b7 <b>'+nN+' needs you</b>':'');
  $('#hmeta').textContent='role model \u00b7 '+nA+' active';
}
function focusLane(key){
  if(narrow())openSheet(true);
  var el=document.getElementById('lane-'+key); if(!el)return;
  el.scrollIntoView({block:'nearest',behavior:(isCalm()||frozen)?'auto':'smooth'});
  el.focus({preventScroll:true});
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  clearTimeout(el._t); el._t=setTimeout(function(){el.classList.remove('flash')},isCalm()?2200:1500);
}
function jumpQuestion(){
  if(narrow())openSheet(false);
  var q=log.querySelector('.ev.question'); if(!q)return;
  q.scrollIntoView({block:'center',behavior:(isCalm()||frozen)?'auto':'smooth'});
  var c=q.querySelector('.card'); c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash');
  setTimeout(function(){c.classList.remove('flash')},isCalm()?2200:1500);
  var b=q.querySelector('.qbtn'); if(b)b.focus({preventScroll:true});
}
function openSheet(on){
  S.sheet=on; body.classList.toggle('sheet-open',on);
  pill.setAttribute('aria-expanded',on?'true':'false');
  if(on)$('#sclose').focus({preventScroll:true});
}

/* ---------- scripted lane mutations ---------- */
function ensureGhost(){
  if(lane('ws-pyazfs'))return;
  lanes.push({key:'ws-pyazfs',title:'kit-coord-ui design',state:'placing',ghost:true,active:true,skeleton:true,born:3,fresh:S.anim,tasks:[{id:'ws-pyazfs-t1',st:'placing',label:'placing'}]});
}
function startPy(){
  var p=lane('ws-pyazfs'); p.ghost=false;p.skeleton=false;p.state='starting';p.tasks[0].st='starting';p.tasks[0].label='starting';
  p.meta=['tab t2v','space herdr-kit','omp @design'];p.changed=S.anim;
}
function runPy(){var p=lane('ws-pyazfs');p.state='running';p.active=false;p.tasks[0].st='running';p.tasks[0].label='running';p.changed=S.anim}
function closeP7(){var l=lane('ws-p7pfy2');l.state='done';l.active=false;l.outcome='coord-design role (omp @design) added; 011b0de deployed live and verified';l.changed=S.anim}
function askK3(){var l=lane('ws-k3m2ab');l.state='asks';l.changed=S.anim}

function doneSteps(skip){return PHASES.map(function(_,i){return skip.indexOf(i)>=0?'skipped':'done'})}

/* ---------- turn scripts ---------- */
var SC={
  main:{
    time:'14:21',phases:[900,1200,1100],skip:[],
    acts:['reading inbox \u00b7 1 message from you \u00b7 1 delegate report (ws-p7pfy2)','matching ws-pyazfs against 2 open lanes \u00b7 herdr-kit checkout free of conflicts \u2192 role coord-design','starting omp @design \u2192 tab t2v in space herdr-kit'],
    enter:function(i){
      if(i===0){lane('ws-p7pfy2').active=true}
      if(i===1){lane('ws-p7pfy2').active=false;ensureGhost()}
      if(i===2){startPy()}
      renderLanes();
    },
    done:'Done in 3.2s \u00b7 1 placed \u00b7 1 closed',
    doneAct:'placed ws-pyazfs-t1 \u2192 t2v \u00b7 closed ws-p7pfy2 \u00b7 noted i5 \u00b7 1 question for you',
    replies:[
      [0,function(){addCo({time:'14:21',text:MAINREPLY,chips:[['task','ws-pyazfs-t1','lane:ws-pyazfs'],['role','coord-design'],['tab','kit-coord-ui','link'],['space','herdr-kit','link']]})}],
      [450,function(){runPy();renderLanes();addEv(EV.placedPy())}],
      [850,function(){closeP7();renderLanes();addEv(EV.donaP7())}],
      [1250,function(){addEv(EV.decision())}],
      [1700,function(){askK3();renderLanes();addEv(EV.question());say('Coordinator replied. One question needs you.')}]
    ]
  },
  generic:{
    time:'14:24',phases:[900],skip:[1,2],
    acts:['reading inbox \u00b7 1 message from you'],
    enter:function(){},
    done:'Done in 0.9s \u00b7 nothing to place',
    doneAct:'no placement needed \u00b7 replied',
    replies:[[0,function(){addCo({time:'14:24',text:'Noted. Nothing to place for this one \u2014 I will keep it in context and surface anything that needs you.'});say('Coordinator replied.')}]]
  },
  queue:{
    time:'14:23',phases:[700],skip:[1,2],
    acts:['reading inbox \u00b7 your answer to the deploy question'],
    enter:function(){},
    done:'Done in 0.7s \u00b7 install queued',
    doneAct:'install queued behind popup edits on main',
    replies:[[0,function(){var l=lane('ws-k3m2ab');l.state='running';l.note='install queued until the popup edits are committed';l.changed=S.anim;renderLanes();addCo({time:'14:23',text:'Queued. I will run the updater from committed `main` HEAD once the popup edits land; nothing deploys before that.'});say('Coordinator replied.')}]]
  },
  hold:{
    time:'14:23',phases:[700],skip:[1,2],
    acts:['reading inbox \u00b7 your answer to the deploy question'],
    enter:function(){},
    done:'Done in 0.7s \u00b7 install on hold',
    doneAct:'install on hold until you say go',
    replies:[[0,function(){var l=lane('ws-k3m2ab');l.state='running';l.note='install on hold until you say go';l.changed=S.anim;renderLanes();addCo({time:'14:23',text:'Holding. I will not install anything until you say go; the popup edits stay untouched.'});say('Coordinator replied.')}]]
  }
};

function phaseStates(sc,i){
  return PHASES.map(function(_,j){
    if(sc.skip.indexOf(j)>=0)return 'skipped';
    if(j<i)return 'done'; if(j===i)return 'active'; return 'pending';
  });
}
function enterPhase(sc,i,dur,held){
  S.phaseIdx=i;
  sc.enter(i);
  setSteps(phaseStates(sc,i),held?{p:held}:{dur:dur});
  setAct(sc.acts[i]||'');
  var txt=PHASES[i].name;
  setPstate(txt+' \u00b7 step '+(i+1)+' of 3','on');
  showWork(true,txt);
  say('Coordinator: '+txt.toLowerCase());
}
function finishSteps(sc){
  setSteps(doneSteps(sc.skip));
  setPstate(sc.done,'ok'); setAct(sc.doneAct);
  S.phaseIdx=-1;
}

function runTurn(text,kind){
  if(S.working)return;
  var id=++S.turn; S.timers.forEach(clearTimeout); S.timers=[];
  var sc=SC[kind];
  if(kind==='main')S.mainDone=true;
  S.working=true; S.anim=true; paintWorking();
  addMe(text,sc.time);
  inp.value=''; autosize(); updateSend();
  var t=0;
  sc.phases.forEach(function(d,i){
    (function(i,d,t0){setTimer(t0,function(){enterPhase(sc,i,d)},id)})(i,d,t);
    t+=d;
  });
  setTimer(t+100,function(){
    showWork(false); finishSteps(sc);
  },id);
  sc.replies.forEach(function(r){
    (function(delay,fn){setTimer(t+150+delay,function(){
      if(S.working){S.working=false;paintWorking()}
      fn();
    },id)})(r[0],r[1]);
  });
}

function answerQuestion(which){
  var card=log.querySelector('.ev.question'); if(!card||card.classList.contains('answered'))return;
  if(S.working){notify('Coordinator is mid-turn \u2014 answer again in a moment.');return}
  var label=which==='queue'?'Queue after commit':'Hold';
  card.classList.add('answered');
  card.querySelector('.e1 b').textContent='Answered';
  card.querySelector('.qa').outerHTML='<div class="qdone">You chose <b>'+esc(label)+'</b></div>';
  runTurn(label,which);
}

/* ---------- presets ---------- */
function resetAll(){
  S.turn++; S.timers.forEach(clearTimeout); S.timers=[];
  S.working=false; S.mainDone=false; S.phaseIdx=-1; S.anim=false;
  log.innerHTML=''; inp.value=''; lanes=mkLanes();
  openSheet(false);
  buildHistory(); renderLanes();
  setSteps(['pending','pending','pending']);
  setPstate('Standing by \u00b7 last turn 13:41 \u00b7 3.1s',null);
  setAct('idle \u00b7 journal seq 4821 \u00b7 nothing waiting in the inbox');
  paintWorking();
}
function load(name){
  resetAll();
  if(name==='typing'){inp.value=SAMPLE}
  if(name==='working'){
    addMe(SAMPLE,'14:21');
    S.working=true; paintWorking();
    var sc=SC.main; sc.enter(0); enterPhase(sc,1,1200,62);
  }
  if(name==='reply'){
    var sc2=SC.main; S.mainDone=true;
    addMe(SAMPLE,'14:21');
    sc2.enter(0);sc2.enter(1);sc2.enter(2);
    sc2.replies.forEach(function(r){r[1]()});
    finishSteps(sc2);
    ensureNoPulse();
    renderLanes();
  }
  S.anim=true; autosize(); updateSend(); paintWorking();
  scrollEnd(false);
  document.querySelectorAll('[data-s]').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-s')===name?'true':'false')});
  if(!frozen)try{inp.focus({preventScroll:true})}catch(e){}
}
function ensureNoPulse(){lanes.forEach(function(l){l.active=false})}

/* ---------- composer ---------- */
function autosize(){inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,88)+'px'}
function updateSend(){send.disabled=S.working||!inp.value.trim()}
inp.addEventListener('input',function(){autosize();updateSend()});
inp.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.isComposing){e.preventDefault();submit()}
});
$('#comp').addEventListener('submit',function(e){e.preventDefault();submit()});
function submit(){
  var t=inp.value.trim(); if(!t||S.working)return;
  runTurn(t,S.mainDone?'generic':'main');
}

/* ---------- delegated clicks ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('[data-lane],[data-go],[data-q],[data-jump],[data-ext],[data-m],[data-s],[data-w]'):null;
  var menu=$('#menu');
  if(!menu.hidden&&!(el&&el.hasAttribute('data-m'))&&!e.target.closest('#menubtn'))closeMenu();
  if(!el)return;
  if(el.hasAttribute('data-lane')){focusLane(el.getAttribute('data-lane'));return}
  if(el.hasAttribute('data-go')){notify('Would focus \u201c'+el.getAttribute('data-go')+'\u201d in Herdr (tab.select / space.select). Mock only.');return}
  if(el.hasAttribute('data-q')){answerQuestion(el.getAttribute('data-q'));return}
  if(el.hasAttribute('data-jump')){jumpQuestion();return}
  if(el.hasAttribute('data-ext')){notify(el.getAttribute('data-ext')+' is an existing coordinator view; not part of this mock.');return}
  if(el.hasAttribute('data-m')){
    var m=el.getAttribute('data-m'); closeMenu();
    notify(m==='clear'?'Clear context requested \u2014 a fresh coordinator session starts when the current turn ends (mock).':m==='restart'?'Graceful restart requested \u2014 waits for the current turn (mock).':'Would show the raw coordinator terminal (agent.focus). Mock only.');
    return;
  }
  if(el.hasAttribute('data-s')){var s=el.getAttribute('data-s');history.replaceState(null,'','#'+s);load(s);return}
  if(el.hasAttribute('data-w')){setWidth(el.getAttribute('data-w'))}
});
log.addEventListener('mouseover',function(e){rel(e,true)});
log.addEventListener('mouseout',function(e){rel(e,false)});
log.addEventListener('focusin',function(e){rel(e,true)});
log.addEventListener('focusout',function(e){rel(e,false)});
function rel(e,on){
  var ev=e.target.closest?e.target.closest('.ev[data-rel]'):null; if(!ev)return;
  var l=document.getElementById('lane-'+ev.getAttribute('data-rel')); if(l)l.classList.toggle('rel',on);
}

/* ---------- pill, sheet, menu, esc ---------- */
pill.addEventListener('click',function(){openSheet(!S.sheet)});
$('#sclose').addEventListener('click',function(){openSheet(false);pill.focus()});
$('#scrim').addEventListener('click',function(){openSheet(false);pill.focus()});
function closeMenu(){$('#menu').hidden=true;$('#menubtn').setAttribute('aria-expanded','false')}
$('#menubtn').addEventListener('click',function(e){
  e.stopPropagation();
  var m=$('#menu');
  if(!m.hidden){closeMenu();return}
  m.hidden=false; this.setAttribute('aria-expanded','true');
  var d=dlg.getBoundingClientRect(), b=this.getBoundingClientRect();
  m.style.top=(b.bottom-d.top+4)+'px';
  m.style.left=Math.max(8,Math.min(b.right-d.left-m.offsetWidth,d.width-m.offsetWidth-8))+'px';
  m.querySelector('button').focus();
});
$('#close').addEventListener('click',closeDialog);
function closeDialog(){dlg.hidden=true;$('#reopen').hidden=false;$('#reopen').focus()}
$('#reopen').addEventListener('click',function(){dlg.hidden=false;this.hidden=true;inp.focus()});
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape')return;
  if(!$('#menu').hidden){closeMenu();$('#menubtn').focus();return}
  if(S.sheet&&narrow()){openSheet(false);pill.focus();return}
  if(!dlg.hidden)closeDialog();
});

/* ---------- width / motion toggles ---------- */
function setWidth(w){
  root.classList.remove('w-wide','w-narrow');
  if(w!=='auto')root.classList.add('w-'+w);
  var u=new URL(location.href); if(w==='auto')u.searchParams.delete('w'); else u.searchParams.set('w',w);
  history.replaceState(null,'',u.pathname+u.search+u.hash);
  paintWidthButtons();
}
function paintWidthButtons(){
  var cur=root.classList.contains('w-narrow')?'narrow':root.classList.contains('w-wide')?'wide':'auto';
  document.querySelectorAll('[data-w]').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-w')===cur?'true':'false')});
}
var rm=$('#rm'); rm.checked=isCalm();
rm.addEventListener('change',function(){
  root.classList.toggle('calm',rm.checked);
  setSteps(S.phaseIdx>=0?phaseStates(SC.main,S.phaseIdx):currentStates(),S.phaseIdx>=0?{p:50}:{});
});
function currentStates(){return [].map.call(stepsEl.children,function(el){return el.classList.contains('done')?'done':el.classList.contains('skipped')?'skipped':el.classList.contains('active')?'active':'pending'})}
if(window.matchMedia){
  var mq=matchMedia('(prefers-reduced-motion: reduce)');
  var onmq=function(){if(mq.matches){root.classList.add('calm');rm.checked=true}};
  if(mq.addEventListener)mq.addEventListener('change',onmq);
}

/* ---------- boot ---------- */
buildSteps(); paintWidthButtons();
var VALID={idle:1,typing:1,working:1,reply:1};
function hashState(){var h=(location.hash||'#idle').slice(1);return VALID[h]?h:'idle'}
window.addEventListener('hashchange',function(){load(hashState())});
load(hashState());
})();
</script>
