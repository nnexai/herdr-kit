<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>kit-coord-ui · 01 Quiet Concierge (conversation)</title>
<!--
  Variant 01 "Quiet Concierge" — conversation-first.
  Self-contained: inline CSS/JS/SVG, no network assets.
  URL: #idle | #typing | #working | #reply   ?w=narrow   ?freeze=1   ?rm=1 (force reduced motion)   ?rm=0
  Tokens are the herdr-kit popup tokens (evidence/popup-consistency/design-mock.html:6); the serif voice,
  rgba tints and the question/ticker treatments are extensions made for this variant.
-->
<style>
:root{
  --page:#101214;--popover:#24272b;--raised:#2d3035;--hover:#34373c;--selected:#3b3e44;--border:#44474d;--input:#2a2d31;
  --fg:#e6e7e9;--muted:#9a9ea5;--dim:#6f7379;--faint:#868b92;
  --accent:#8fa9dc;--accent-fg:#14181f;--working:#e2b94e;--blocked:#ef6a67;--done:#6fcf97;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Source Serif 4","Source Serif Pro","Noto Serif","DejaVu Serif",Georgia,serif;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--fg);font:13px/1.5 var(--sans);display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 16px 16px;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.i{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono)}

/* ---------- demo bar (not part of the product) ---------- */
.demo{flex:none;width:100%;max-width:900px;height:26px;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);overflow-x:auto;scrollbar-width:none;white-space:nowrap}
html.narrow .demo{max-width:360px}
.demo::-webkit-scrollbar{display:none}
.demo .lbl{font-family:var(--mono);color:var(--faint);flex:none;margin-right:4px}
.demo button,.demo label{height:22px;padding:0 9px;border:1px solid var(--border);border-radius:11px;background:transparent;font-size:11px;display:inline-flex;align-items:center;gap:5px;cursor:pointer;flex:none;color:var(--muted)}
.demo button[aria-pressed="true"]{background:var(--selected);color:var(--fg);border-color:#5a5e66}
.demo button:hover,.demo label:hover{background:var(--hover);color:var(--fg)}
.demo .gap{flex:1}
.demo input{margin:0;accent-color:var(--accent)}
@media (max-width:480px){.demo .lbl{display:none}body{padding-left:10px;padding-right:10px}}
html.narrow body{padding-left:10px;padding-right:10px}

/* ---------- dialog shell (matches popup shell: popover bg, 18px padding) ---------- */
.dlg{flex:1 1 0;min-height:0;width:100%;max-width:900px;display:flex;container:dlg/inline-size;
  border:1px solid #33363b;border-radius:10px;overflow:hidden;position:relative;
  background:radial-gradient(110% 55% at 50% -12%,rgba(143,169,220,.085),transparent 62%),var(--popover)}
html.narrow .dlg{max-width:360px}
.shell{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px;padding:18px 18px 16px}

/* header */
.hdr{flex:none;display:flex;align-items:center;gap:8px;min-height:24px;flex-wrap:wrap;row-gap:8px}
.brk{display:none}
.title{font-weight:600;font-size:15px;white-space:nowrap;flex:none}
.tabs{display:flex;gap:2px;flex:none}
.tab{height:22px;padding:0 8px;border-radius:4px;display:inline-flex;align-items:center;border:0;background:transparent;color:var(--muted);cursor:default;font-size:12.5px}
.tab[aria-selected="true"]{background:var(--selected);color:var(--fg)}
.tab:not([aria-selected="true"]):hover{background:var(--hover)}
.stat{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--accent);white-space:nowrap;min-width:0}
.stat i{width:6px;height:6px;border-radius:3px;background:currentColor;display:block;flex:none}
.stat .x{color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.stat.busy{color:var(--working)}
.hb{height:22px;padding:0 8px;border:1px solid var(--border);border-radius:4px;background:var(--popover);font-size:11px;display:inline-flex;align-items:center;white-space:nowrap;line-height:1;cursor:pointer;flex:none}
.hb:hover{background:var(--hover)}
.hb.ic{width:26px;padding:0;justify-content:center}
.menuwrap{position:relative;flex:none}
.menu{position:absolute;right:0;top:28px;z-index:20;min-width:236px;background:var(--raised);border:1px solid var(--border);border-radius:8px;padding:4px;box-shadow:0 14px 36px rgba(0,0,0,.5)}
.menu[hidden]{display:none}
.menu button{display:flex;flex-direction:column;gap:1px;width:100%;text-align:left;padding:7px 10px;border:0;background:transparent;border-radius:5px;cursor:pointer;font-size:13px}
.menu button:hover,.menu button:focus-visible{background:var(--selected);outline-offset:-2px}
.menu small{font-size:11px;color:var(--muted)}

/* stage */
.stage{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;scrollbar-width:thin;scrollbar-color:#44474d transparent;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 26px);mask-image:linear-gradient(to bottom,transparent 0,#000 26px)}
.col{flex:none;width:100%;max-width:640px;margin:auto auto 0;padding:26px 6px 22px;display:flex;flex-direction:column;gap:20px}
.past{opacity:.42;filter:saturate(.55);transition:opacity .5s,filter .5s}

/* day + context dividers */
.day{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
.day::before,.day::after{content:"";flex:1;height:1px}
.day::before{background:linear-gradient(90deg,transparent,var(--border))}
.day::after{background:linear-gradient(270deg,transparent,var(--border))}
.ctxb{display:flex;flex-direction:column;gap:10px;align-items:center}
.ctxb .day{width:100%;color:var(--accent)}
.ctxb p{margin:0;font:italic 15px/1.5 var(--serif);color:var(--muted);text-align:center}

/* person pill */
.msg.me{align-self:flex-end;max-width:84%;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.pill{padding:9px 15px;border-radius:18px 18px 6px 18px;background:rgba(143,169,220,.13);border:1px solid rgba(143,169,220,.27);font-size:14px;line-height:1.5;color:#eef0f4;overflow-wrap:anywhere}
.msg.me time{font-size:11px;color:var(--faint);padding-right:4px}

/* coordinator voice */
.who{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.who b{font-weight:600}
.who time{letter-spacing:0;text-transform:none;font-size:11px;color:var(--faint)}
.mk{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--accent);border:1px solid rgba(143,169,220,.42);background:rgba(143,169,220,.09)}
.mk svg{width:11px;height:11px}
.msg.co p{margin:0;font:400 17px/1.62 var(--serif);color:#eceef1;letter-spacing:.004em;text-wrap:pretty;overflow-wrap:anywhere}
.msg.co strong{font-weight:700;color:#fff}
.msg.co code{font:12.5px var(--mono);background:var(--raised);border:1px solid rgba(68,71,77,.75);padding:1px 6px;border-radius:5px;color:#c8d3ea;letter-spacing:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.msg.co .chips{margin-top:13px}
.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px 0 6px;border-radius:10px;border:1px solid rgba(154,158,165,.3);background:rgba(255,255,255,.03);color:var(--muted);font:11px/1 var(--sans);white-space:nowrap;max-width:100%}
.chip .k{opacity:.8}
.chip .v{font-family:var(--mono);font-size:10.5px;color:var(--fg);overflow:hidden;text-overflow:ellipsis}
button.chip{cursor:pointer}
.chip.link{color:var(--accent);border-color:rgba(143,169,220,.34);background:rgba(143,169,220,.08)}
.chip.link .v{color:#c9d6f0}
button.chip.link:hover{background:rgba(143,169,220,.18);border-color:rgba(143,169,220,.6)}

/* question card */
.msg.ask{padding:14px 16px 16px;border-radius:16px;border:1px solid rgba(239,106,103,.26);background:linear-gradient(180deg,rgba(239,106,103,.075),rgba(239,106,103,.022))}
.msg.ask .who{margin-bottom:9px}
.badge{margin-left:auto;display:inline-flex;align-items:center;gap:6px;color:var(--blocked);letter-spacing:.08em}
.badge i{width:6px;height:6px;border-radius:3px;background:currentColor}
.msg.ask.answered{border-color:rgba(68,71,77,.7);background:rgba(255,255,255,.015)}
.msg.ask.answered .badge{color:var(--done)}
.qrs{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}
.qr{height:30px;padding:0 15px;border-radius:15px;border:1px solid var(--border);background:var(--raised);color:var(--fg);font-size:13px;cursor:pointer}
.qr:hover{background:var(--hover)}
.qr.first{border-color:var(--accent);color:var(--accent)}
.qr.first:hover{background:rgba(143,169,220,.14)}
.ans{display:flex;align-items:center;gap:7px;margin-top:13px;font-size:12.5px;color:var(--muted)}
.ans svg{color:var(--done)}
.ans b{color:var(--fg);font-weight:600}

/* ticker rows */
.ev{display:grid;grid-template-columns:22px minmax(0,1fr) auto;column-gap:9px;align-items:start;padding:7px 11px 7px 8px;border-radius:10px;
  background:rgba(255,255,255,.028);border:1px solid rgba(68,71,77,.55);font-size:12.5px;color:var(--muted);--c:154,158,165}
.ev.done{--c:111,207,151}.ev.decision{--c:143,169,220}.ev.placed{--c:143,169,220}.ev.progress{--c:226,185,78}
.ev .ic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:rgba(var(--c),.14);color:rgb(var(--c))}
.ev .ic svg{width:13px;height:13px}
.ev .l1{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;min-height:22px}
.ev .et{color:var(--fg);font-weight:500}
.ev code{font:11.5px var(--mono);color:var(--fg);background:rgba(255,255,255,.06);padding:1px 5px;border-radius:4px}
.ev .st{color:rgb(var(--c));font-size:11.5px}
.ev .det{margin-top:1px;padding-bottom:2px;font-size:12px;line-height:1.5;color:var(--muted);overflow-wrap:anywhere}
.ev time{font-size:11px;color:var(--faint);line-height:22px;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;gap:2px}.seg i{width:11px;height:4px;border-radius:2px;background:var(--border)}.seg i.on{background:var(--working)}
.ev+.ev{margin-top:-12px}
.msg+.ev{margin-top:-6px}

/* thinking line */
.think{display:flex;align-items:center;gap:10px;min-height:30px;color:var(--muted);font:italic 15.5px/1.4 var(--serif)}
.dots{display:inline-flex;gap:4px;align-items:center;transition:gap .45s ease,transform .45s ease;transform-origin:left center}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--accent);display:block}
.dots i:nth-child(1){opacity:.4}.dots i:nth-child(2){opacity:.7}.dots i:nth-child(3){opacity:1}
.think.lab .dots{gap:2px;transform:scale(.78)}
.calm{display:none;width:7px;height:7px;border-radius:50%;background:var(--working)}
.label{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;transition:max-width .55s ease,opacity .45s ease}
.think.lab .label{max-width:280px;opacity:1}
.phase{display:inline-block}
.think .el{margin-left:4px;font:11px var(--mono);font-style:normal;color:var(--faint);font-variant-numeric:tabular-nums}

/* dock + composer */
.dock{flex:none;position:relative;padding-top:2px}
.dock::before{content:"";position:absolute;left:0;right:0;top:-34px;height:34px;background:linear-gradient(to bottom,rgba(36,39,43,0),var(--popover));pointer-events:none}
.dockin{max-width:640px;margin:0 auto;width:100%;position:relative}
.waiting{display:flex;align-items:center;gap:8px;margin:0 auto 8px;height:26px;padding:0 12px 0 10px;border-radius:13px;border:1px solid rgba(239,106,103,.3);background:rgba(239,106,103,.08);color:#f4b8b6;font-size:12px;cursor:pointer;position:relative;z-index:1}
.waiting[hidden]{display:none}
.waiting i{width:6px;height:6px;border-radius:3px;background:var(--blocked)}
.waiting:hover{background:rgba(239,106,103,.15)}
.composer{position:relative;background:var(--input);border:1px solid var(--border);border-radius:20px;padding:11px 11px 6px 18px;box-shadow:0 10px 28px rgba(0,0,0,.34);transition:border-color .25s,box-shadow .25s}
.composer:focus-within,.composer.has{border-color:rgba(143,169,220,.55)}
.composer.has{box-shadow:0 10px 28px rgba(0,0,0,.34),0 0 0 3px rgba(143,169,220,.08)}
.edge{position:absolute;top:-1px;left:13%;right:13%;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.5;pointer-events:none;transition:opacity .3s}
.edge::after{content:"";position:absolute;left:0;right:0;top:-3px;bottom:-3px;background:inherit;filter:blur(5px);opacity:.55}
.composer:focus-within .edge,.composer.has .edge{opacity:.95}
.halo{position:absolute;inset:-1px;border-radius:21px;pointer-events:none;opacity:0;box-shadow:0 0 0 1px rgba(143,169,220,.55),0 0 30px 2px rgba(143,169,220,.26);transition:opacity .4s}
.composer.working .halo{opacity:.72}
.composer.working .edge{opacity:1}
.row{display:flex;align-items:flex-end;gap:10px}
textarea{flex:1;min-width:0;resize:none;border:0;outline:0;background:transparent;color:var(--fg);font:14.5px/1.5 var(--sans);padding:4px 0;max-height:112px;min-height:30px;overflow-y:auto;scrollbar-width:thin}
textarea::placeholder{color:var(--faint);font-style:italic}
.send{flex:none;width:32px;height:32px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--hover);color:var(--faint);cursor:default;transition:background .2s,color .2s,box-shadow .2s,transform .2s;margin-bottom:1px}
.send svg{width:16px;height:16px;stroke-width:1.9}
.send:not(:disabled){background:var(--accent);color:var(--accent-fg);cursor:pointer;box-shadow:0 0 16px rgba(143,169,220,.42)}
.send:not(:disabled):hover{transform:translateY(-1px)}
.hint{display:flex;justify-content:space-between;gap:12px;padding:5px 2px 3px 0;min-height:22px;font-size:11px;color:var(--muted);white-space:nowrap}
.hint span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.hint span:last-child{flex:none;color:var(--faint)}

/* ---------- motion: only when html.anim ---------- */
@keyframes rise{from{opacity:0;transform:translateY(10px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
@keyframes flash{from{background-color:rgba(143,169,220,.2)}to{background-color:rgba(255,255,255,.028)}}
@keyframes breathe{0%,100%{opacity:.3}50%{opacity:.95}}
@keyframes edgebreathe{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes bob{0%,62%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-4px);opacity:1}}
@keyframes sheen{from{background-position:120% 0}to{background-position:-120% 0}}
@keyframes swap{from{opacity:0;transform:translateY(6px);filter:blur(2px)}to{opacity:1;transform:none;filter:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes leave{to{opacity:0;transform:translateY(-4px)}}
html.anim .enter{animation:rise .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}
html.anim .ev.enter{animation:rise .55s cubic-bezier(.2,.7,.2,1) both,flash 2.2s ease-out both;animation-delay:var(--d,0s),var(--d,0s)}
html.anim .composer.working .halo{animation:breathe 3.4s ease-in-out infinite}
html.anim .composer.working .edge{animation:edgebreathe 3.4s ease-in-out infinite}
html.anim .dots i{animation:bob 1.25s ease-in-out infinite}
html.anim .dots i:nth-child(2){animation-delay:.16s}
html.anim .dots i:nth-child(3){animation-delay:.32s}
html.anim .phase{background:linear-gradient(100deg,var(--muted) 0 38%,#f2f4f8 50%,var(--muted) 62% 100%);background-size:240% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 2.6s linear infinite}
html.anim .phase.sw{animation:swap .45s ease both,sheen 2.6s linear infinite}
html.anim .stat.busy i{animation:pulse 1.6s ease-in-out infinite}
html.anim .think.out{animation:leave .2s ease both}
/* no animation allowed: transitions off too */
html:not(.anim) *,html:not(.anim) *::before,html:not(.anim) *::after{transition:none!important}
/* reduced motion: static indicator replaces animated dots */
html.rm .dots{display:none}
html.rm .calm{display:inline-block}
html.rm .composer.working .halo{opacity:.6}
html.rm .think{font-style:italic}

/* ---------- narrow (container query = dialog width, so ?w=narrow and a real narrow window agree) ---------- */
@container dlg (max-width:639px){
  .shell{padding:14px 12px 12px;gap:10px}
  .hdr{row-gap:0}
  .tab{padding:0 7px;font-size:12px}
  .brk{display:block;flex-basis:100%;height:0;order:4}
  .title{order:1}.tabs{order:2}
  .hdr>.hb.close{order:3;margin-left:auto}
  .stat{order:5;margin-left:0;margin-top:8px}
  .menuwrap{order:6;margin-left:auto;margin-top:8px}
  .stat .x.opt{display:none}
  .col{padding:22px 2px 18px;gap:18px}
  .msg.co p{font-size:16px;line-height:1.58}
  .msg.me{max-width:90%}
  .msg.ask{padding:12px 13px 14px}
  .qr{padding:0 13px}
  .composer{padding:9px 9px 4px 14px;border-radius:18px}
  .halo{border-radius:19px}
  .ev{padding:7px 9px 7px 7px;column-gap:8px}
  .ev time{display:none}
  .hint span:last-child{display:none}
}
@container dlg (min-width:640px){
  .stat{margin-left:auto}
  .hdr>.hb.close{order:0}
}
</style>
</head>

</defs></svg>

<nav class="demo" aria-label="Mock controls (not part of the product)">
  <span class="lbl">01 · conversation</span>
  <button type="button" data-s="idle" aria-pressed="false">idle</button>
  <button type="button" data-s="typing" aria-pressed="false">typing</button>
  <button type="button" data-s="working" aria-pressed="false">working</button>
  <button type="button" data-s="reply" aria-pressed="false">reply</button>

<div class="dlg">
 <div class="shell" role="dialog" aria-label="Coordinator">
  <header class="hdr">
    <span class="title">Coordinator</span>
    <div class="tabs" role="tablist" aria-label="Coordinator views">
      <button class="tab" role="tab" aria-selected="true" type="button">Talk</button>
      <button class="tab" role="tab" aria-selected="false" type="button" tabindex="-1">Board</button>
      <button class="tab" role="tab" aria-selected="false" type="button" tabindex="-1">Timeline</button>
    </div>
    <span class="brk" aria-hidden="true"></span>
    <span class="stat" id="stat" role="status"><i aria-hidden="true"></i><span id="statTxt">running</span><span class="x opt">· role model</span><span class="x">· 2 active</span></span>
    <span class="menuwrap">
      <button class="hb ic" id="menuBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Coordinator actions"><svg class="i"><use href="#i-more"/></svg></button>
      <div class="menu" id="menu" role="menu" hidden>
        <button role="menuitem" type="button" data-m="clear">Clear context<small>Fresh session once the current turn ends</small></button>
        <button role="menuitem" type="button" data-m="show">Show coordinator terminal<small>The raw agent, for when you want it</small></button>
      </div>
    </span>
    <button class="hb close" type="button">Close</button>
  </header>

  <div class="stage">
    <div class="scroll" id="scroll" tabindex="0" role="log" aria-label="Conversation with the coordinator" aria-relevant="additions">
      <div class="col" id="col"></div>
    </div>
    <div class="dock">
      <div class="dockin">
        <button class="waiting" id="waiting" type="button" hidden><i aria-hidden="true"></i><span>1 question waiting for you</span><svg class="i" style="transform:rotate(0deg)"><use href="#i-up"/></svg></button>
        <form class="composer" id="composer" autocomplete="off">
          <span class="edge" aria-hidden="true"></span><span class="halo" aria-hidden="true"></span>
          <div class="row">
            <textarea id="ta" rows="1" placeholder="Tell the coordinator what you need…" aria-label="Message to the coordinator"></textarea>
            <button class="send" id="send" type="submit" aria-label="Send message" disabled><svg class="i"><use href="#i-up"/></svg></button>
          </div>
          <div class="hint"><span id="hintL">Enter to send</span><span>Esc closes</span></div>
        </form>
      </div>
    </div>
  </div>
 </div>
</div>
<div class="sr" id="sr" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const root=document.documentElement, qs=new URLSearchParams(location.search);
const freeze=qs.get('freeze')==='1';
if(qs.get('w')==='narrow') root.classList.add('narrow');
const mq=matchMedia('(prefers-reduced-motion: reduce)');
let rm=qs.has('rm')?qs.get('rm')==='1':mq.matches;
function motion(){root.classList.toggle('rm',rm);root.classList.toggle('anim',!rm&&!freeze);root.classList.toggle('freeze',freeze);$('#rmChk').checked=rm;}
mq.addEventListener('change',e=>{if(!qs.has('rm')){rm=e.matches;motion();}});
const still=()=>rm||freeze;

/* ---------- helpers ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');
const ico=n=>'<svg class="i" aria-hidden="true"><use href="#i-'+n+'"/></svg>';
function mk(tag,cls){const e=document.createElement(tag);if(cls)e.className=cls;return e;}
function chip(c){
  const t=c.link?'button':'span';
  return '<'+t+(c.link?' type="button"':'')+' class="chip'+(c.link?' link':'')+'"'+(c.title?' title="'+esc(c.title)+'"':'')+'>'+ico(c.ic)+'<span class="k">'+esc(c.k)+'</span><span class="v">'+esc(c.v)+'</span></'+t+'>';
}

/* ---------- sample content (real coordinator events) ---------- */
const DEMO_TEXT='one more idea: kit-coord-ui instead of seeing the coordinator agent we have a simplified chat input and response timeline - draft a few variants';
const PH=['reading journal…','checking roles…','placing…','writing reply…'];
const HIST=[
  {k:'day',t:'Today'},
  {k:'ev',type:'done',ic:'check',t:'`ws-p7pfy2` closed',st:'delivered',time:'13:41',d:'coord-design role (omp @design) added, prompt routes UI/UX design to it; 011b0de deployed live and verified'},
  {k:'co',time:'13:41',t:'That one is closed. UI and visual design now has its own lane, so mockups like this will not queue behind **deep engineering** work.'},
  {k:'ev',type:'decision',ic:'diamond',t:'Decision noted · `i5`',time:'13:42',d:'UI/UX and visual design work: use role coord-design (omp @design), not coord-deep.'},
  {k:'co',q:true,id:'q1',time:'14:06',t:'The popup edits in `mods/herdr-kit-coord` are uncommitted on main from another task. Deploy waits for committed HEAD — should I queue the install after they land, or hold until you say go?',replies:['Queue after commit','Hold']}
];
const ME={k:'me',time:'14:09',t:DEMO_TEXT};
const REPLIES={
  demo:[
    {k:'co',time:'14:09',t:'Placing this as **ws-pyazfs-t1** on the design role (omp @design). Reason: mock-only docs in the herdr-kit checkout, no conflict with popup edits in `mods/herdr-kit-coord`.',
      chips:[{ic:'task',k:'task',v:'ws-pyazfs-t1',link:1},{ic:'role',k:'role',v:'coord-design',link:1},{ic:'tab',k:'tab',v:'kit-coord-ui',link:1},{ic:'folder',k:'space',v:'herdr-kit',link:1}]},
    {k:'ev',type:'placed',ic:'place',t:'`ws-pyazfs-t1` placed',time:'14:09',
      chips:[{ic:'tab',k:'tab',v:'t2v',link:1},{ic:'folder',k:'space',v:'herdr-kit',link:1},{ic:'cpu',k:'harness',v:'omp'},{ic:'spark',k:'model',v:'@design'}]},
    {k:'ev',type:'progress',ic:'pulse',t:'Delegate progress',time:'14:10',seg:[3,5],d:'board overhaul: 3 of 5 popup tests green'}
  ],
  queue:[
    {k:'co',time:'14:10',t:'Queued. I will run the install from committed HEAD as soon as the popup edits land, and tell you when it is **live**.'},
    {k:'ev',type:'decision',ic:'diamond',t:'Install queued',time:'14:10',d:'waits for committed HEAD on main'}
  ],
  hold:[
    {k:'co',time:'14:10',t:'Holding. Nothing deploys until you say **go**.'},
    {k:'ev',type:'decision',ic:'diamond',t:'Deploy on hold',time:'14:10',d:'released only by the person'}
  ],
  generic:[
    {k:'co',time:'14:10',t:'Noted. I will read the journal first and place this where it fits.'}
  ]
};

/* ---------- renderers ---------- */
function render(it){
  let el;
  if(it.k==='day'){el=mk('div','day');el.innerHTML='<span>'+esc(it.t)+'</span>';}
  else if(it.k==='me'){
    el=mk('article','msg me');el.setAttribute('aria-label','You, '+it.time);
    el.innerHTML='<div class="pill">'+esc(it.t)+'</div><time>'+it.time+'</time>';
  }else if(it.k==='co'){
    el=mk('article','msg co'+(it.q?' ask':''));el.setAttribute('aria-label','Coordinator, '+it.time+(it.q?', question for you':''));
    if(it.id)el.dataset.id=it.id;
    let h='<div class="who"><span class="mk">'+ico('spark')+'</span><b>Coordinator</b><time>'+it.time+'</time>'+(it.q?'<span class="badge"><i></i><span class="bt">Question for you</span></span>':'')+'</div><p>'+md(it.t)+'</p>';
    if(it.chips)h+='<div class="chips">'+it.chips.map(chip).join('')+'</div>';
    if(it.replies)h+='<div class="qrs" role="group" aria-label="Quick replies">'+it.replies.map((r,i)=>'<button type="button" class="qr'+(i===0?' first':'')+'" data-a="'+esc(r)+'">'+esc(r)+'</button>').join('')+'</div>';
    el.innerHTML=h;
  }else if(it.k==='ev'){
    el=mk('div','ev '+it.type);el.setAttribute('role','article');el.setAttribute('aria-label','Event: '+it.t.replace(/`/g,'')+(it.st?', '+it.st:'')+', '+it.time);
    let l1='<span class="et">'+md(it.t)+'</span>';
    if(it.st)l1+='<span class="st">'+esc(it.st)+'</span>';
    if(it.seg)l1+='<span class="seg" role="img" aria-label="'+it.seg[0]+' of '+it.seg[1]+'">'+Array.from({length:it.seg[1]},(_,i)=>'<i'+(i<it.seg[0]?' class="on"':'')+'></i>').join('')+'</span>';
    if(it.chips)l1+='<span class="chips" style="display:contents">'+it.chips.map(chip).join('')+'</span>';
    el.innerHTML='<span class="ic">'+ico(it.ic)+'</span><div class="evb"><div class="l1">'+l1+'</div>'+(it.d?'<div class="det">'+md(it.d)+'</div>':'')+'</div><time>'+it.time+'</time>';
  }else if(it.k==='ctx'){
    el=mk('div','ctxb');el.innerHTML='<div class="day"><span>Context cleared</span></div><p>Fresh session. Ask anything — I read the journal first.</p>';
  }
  return el;
}

/* ---------- state ---------- */
const col=$('#col'),scroller=$('#scroll'),ta=$('#ta'),send=$('#send'),composer=$('#composer'),hintL=$('#hintL'),stat=$('#stat'),statTxt=$('#statTxt'),sr=$('#sr'),waiting=$('#waiting');
let state='idle',busy=false,timers=[],ints=[],thinkEl=null,t0=0,io=null;
const at=(ms,fn)=>{timers.push(setTimeout(fn,ms));};
function clearAll(){timers.forEach(clearTimeout);ints.forEach(clearInterval);timers=[];ints=[];}
function scrollEnd(smooth){scroller.scrollTo({top:scroller.scrollHeight,behavior:smooth&&!still()?'smooth':'auto'});}
function announce(t){sr.textContent='';setTimeout(()=>{sr.textContent=t;},30);}
function bar(s){document.querySelectorAll('.demo [data-s]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.s===s)));}
function url(s){try{history.replaceState(null,'','#'+s);}catch(e){}}

function autosize(){ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,112)+'px';}
function syncComposer(){
  const has=ta.value.trim().length>0;
  composer.classList.toggle('has',has&&!busy);
  send.disabled=!has||busy;
}
function setMode(m){
  const w=m==='working';
  composer.classList.toggle('working',w);
  stat.classList.toggle('busy',w);
  statTxt.textContent=w?'working':'running';
  hintL.textContent=w?'Coordinator is working · you can keep typing':'Enter to send';
  ta.placeholder=w?'Coordinator is working…':'Tell the coordinator what you need…';
  syncComposer();
}

/* ---------- thinking line ---------- */
function showThinking(){
  if(thinkEl)return;
  thinkEl=mk('div','think enter');thinkEl.setAttribute('aria-hidden','true');
  thinkEl.innerHTML='<span class="dots"><i></i><i></i><i></i></span><span class="calm"></span><span class="label"><span class="phase">Working…</span></span><span class="el">0:00</span>';
  col.appendChild(thinkEl);
  scrollEnd(true);
}
function setPhase(t){
  if(!thinkEl)return;
  const ph=thinkEl.querySelector('.phase');
  ph.textContent=rm?'Working · '+t:t;
  thinkEl.classList.add('lab');
  ph.classList.remove('sw');void ph.offsetWidth;ph.classList.add('sw');
}
function startElapsed(offset){
  const el=thinkEl&&thinkEl.querySelector('.el');if(!el)return;
  t0=Date.now()-offset;
  const f=()=>{const s=Math.max(0,Math.floor((Date.now()-t0)/1000));el.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
  f();
  if(!freeze)ints.push(setInterval(f,500));
}
function phases(first){
  let i=0;
  const step=()=>{setPhase(PH[i%PH.length]);i++;};
  if(still()&&freeze){step();return;}
  if(first===0){step();ints.push(setInterval(step,1300));}
  else at(first,()=>{step();ints.push(setInterval(step,1300));});
}
function hideThinking(cb){
  const e=thinkEl;thinkEl=null;
  if(!e){cb&&cb();return;}
  if(still()){e.remove();cb&&cb();return;}
  e.classList.remove('enter');e.classList.add('out');
  setTimeout(()=>{e.remove();cb&&cb();},210);
}

/* ---------- thread ops ---------- */
function add(it,delay,animate){
  const el=render(it);
  if(animate!==false){el.classList.add('enter');if(delay)el.style.setProperty('--d',(delay/1000)+'s');}
  col.appendChild(el);
  if(thinkEl&&el!==thinkEl)col.appendChild(thinkEl);
  return el;
}
function watchQuestion(){
  if(io){io.disconnect();io=null;}
  const q=col.querySelector('.msg.ask:not(.answered):not(.past)');
  if(!q){waiting.hidden=true;return;}
  io=new IntersectionObserver(es=>{waiting.hidden=es[es.length-1].isIntersecting;},{root:scroller,threshold:.5});
  io.observe(q);
}
waiting.addEventListener('click',()=>{
  const q=col.querySelector('.msg.ask:not(.answered):not(.past)');
  if(q)q.scrollIntoView({behavior:still()?'auto':'smooth',block:'center'});
});

function tail(kind,animate){
  const arr=REPLIES[kind]||REPLIES.generic;
  arr.forEach((it,i)=>add(it,i===0?0:450+(i-1)*650,animate));
}

function runTurn(text,kind){
  busy=true;
  add({k:'me',time:'14:09',t:text});
  composer.classList.remove('has');
  setMode('working');bar('working');url('working');announce('Coordinator is working.');
  scrollEnd(true);
  at(still()?0:450,()=>{showThinking();startElapsed(0);phases(still()?0:900);});
  const total=still()?1500:5900;
  at(total,()=>{
    hideThinking(()=>{
      busy=false;setMode('idle');bar('reply');url('reply');
      tail(kind,true);
      announce('Coordinator replied.');
      scrollEnd(true);
      const n=(REPLIES[kind]||REPLIES.generic).length;
      for(let i=1;i<n;i++)at(450+(i-1)*650+80,()=>scrollEnd(true));
      watchQuestion();
    });
  });
}

function goto(s){
  if(['idle','typing','working','reply'].indexOf(s)<0)s='idle';
  state=s;clearAll();busy=false;thinkEl=null;col.innerHTML='';
  HIST.forEach(it=>add(it,0,false));
  ta.value=s==='typing'?DEMO_TEXT:'';autosize();
  if(s==='working'||s==='reply')add(ME,0,false);
  if(s==='working'){
    setMode('working');
    showThinking();
    if(thinkEl)thinkEl.classList.remove('enter');
    startElapsed(3000);
    phases(freeze?0:(rm?0:900));
  }else{
    setMode('idle');
    if(s==='reply')tail('demo',true);
  }
  bar(s);
  syncComposer();
  scrollEnd(false);
  if(s==='reply')at(1500,()=>scrollEnd(false));
  watchQuestion();
  if(!freeze&&(s==='idle'||s==='typing')){try{ta.focus({preventScroll:true});ta.setSelectionRange(ta.value.length,ta.value.length);}catch(e){}}
}

/* ---------- interaction ---------- */
ta.addEventListener('input',()=>{autosize();syncComposer();if(!busy){const s=ta.value.trim()?'typing':'idle';bar(s);}});
ta.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();submit();}
});
composer.addEventListener('submit',e=>{e.preventDefault();submit();});
function submit(){
  const t=ta.value.trim();
  if(!t||busy)return;
  ta.value='';autosize();
  runTurn(t,t===DEMO_TEXT?'demo':'generic');
}
col.addEventListener('click',e=>{
  const b=e.target.closest('.qr');if(!b||busy)return;
  const card=b.closest('.msg.ask');if(!card||card.classList.contains('answered'))return;
  const choice=b.dataset.a;
  card.classList.add('answered');
  card.querySelector('.bt').textContent='Answered';
  card.querySelector('.qrs').outerHTML='<div class="ans">'+ico('check')+'<span>You answered <b>'+esc(choice)+'</b></span></div>';
  watchQuestion();
  runTurn(choice,choice.toLowerCase().indexOf('queue')===0?'queue':'hold');
});

/* header menu */
const menu=$('#menu'),menuBtn=$('#menuBtn');
function menuOpen(o){menu.hidden=!o;menuBtn.setAttribute('aria-expanded',String(o));if(o){const f=menu.querySelector('button');f&&f.focus();}}
menuBtn.addEventListener('click',e=>{e.stopPropagation();menuOpen(menu.hidden);});
document.addEventListener('click',e=>{if(!menu.hidden&&!menu.contains(e.target))menuOpen(false);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!menu.hidden){e.preventDefault();menuOpen(false);menuBtn.focus();}});
menu.addEventListener('click',e=>{
  const b=e.target.closest('[data-m]');if(!b)return;
  menuOpen(false);
  if(b.dataset.m==='clear'){
    col.querySelectorAll('.day,.msg,.ev').forEach(n=>n.classList.add('past'));
    add({k:'ctx'});
    watchQuestion();scrollEnd(true);announce('Context cleared. Fresh session.');
  }else{
    add({k:'ev',type:'neutral',ic:'term',t:'Opened the coordinator terminal',time:'14:11',d:'raw agent tab, unchanged'});
    scrollEnd(true);
  }
});

/* demo bar */
document.querySelectorAll('.demo [data-s]').forEach(b=>b.addEventListener('click',()=>{
  if(location.hash==='#'+b.dataset.s)goto(b.dataset.s);else location.hash=b.dataset.s;
}));
$('#wToggle').addEventListener('click',()=>{
  const u=new URL(location.href);
  if(u.searchParams.get('w')==='narrow')u.searchParams.delete('w');else u.searchParams.set('w','narrow');
  location.href=u.toString();
});
$('#wToggle').textContent=root.classList.contains('narrow')?'wide':'narrow';
$('#rmChk').addEventListener('change',e=>{rm=e.target.checked;motion();goto(state);});
window.addEventListener('hashchange',()=>goto(location.hash.slice(1)));

motion();
goto(location.hash.slice(1)||'idle');
})();
</script>
</body>
</html>
