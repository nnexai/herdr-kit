<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Herdr — coordinator sidebar mock</title>
<style>
:root{
  --chrome:#14161a; --term:#171a1f; --raise:#21252c; --sel:#202429; --hov:#1a1d22;
  --fg:#abb2bf; --fg2:#d7dae0; --mut:#7f848e; --mut2:#5c6370; --bd:#2a2f38;
  --blue:#61afef; --red:#e06c75; --green:#98c379; --yel:#e5c07b; --pur:#c678dd;
  --pw:368px;
  --mono:"JetBrains Mono","JetBrainsMono Nerd Font","DejaVu Sans Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:#0b0c0f;color:var(--fg);
  font:13px/1.4 Inter,"Inter Variable",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left}
svg{display:block;flex:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--blue);outline-offset:-2px;border-radius:5px}
body.dragging{cursor:col-resize;user-select:none}
.sp{flex:1}
.mu{color:var(--mut)}

/* ---------- demo bar (not product) ---------- */
.demo{flex:none;min-height:40px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:6px 12px;
  background:#0b0c0f;border-bottom:1px dashed #3a3f49;font-size:12px;color:#8a909c}
.demo .dl{font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:11px;color:#9aa0ab}
.demo .dl em{font-style:normal;font-weight:400;text-transform:none;letter-spacing:0;color:#5f6572;margin-left:6px}
.demo .dg{display:flex;align-items:center;gap:8px}
.seg{display:flex}
.seg button,.db{padding:3px 10px;border:1px solid #2c313a;background:#101216;color:#9aa0ab;border-radius:0;line-height:1.4}
.seg button+button{margin-left:-1px}
.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}
.seg button:hover,.db:hover{color:#e6e9ef;background:#171a20}
.seg button.on{background:#223552;border-color:#35527c;color:#cfe3ff;position:relative}
.db{border-radius:6px}
.db[aria-disabled=true]{opacity:.45}
.wlab{color:#5f6572;font-variant-numeric:tabular-nums;min-width:38px}

/* ---------- window ---------- */
.win{flex:1;min-height:0;display:flex;background:var(--chrome);position:relative}
.win.ls-off .ls{display:none}
.win.rp-off .rp{display:none}

/* left sidebar */
.ls{width:268px;flex:none;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--bd);background:var(--chrome)}
.brand{height:44px;flex:none;display:flex;align-items:center;gap:9px;padding:0 10px 0 14px;font-size:14px;color:var(--fg2);font-weight:500}
.ib{width:26px;height:26px;display:grid;place-items:center;border-radius:6px;color:var(--mut);flex:none}
.ib:hover{background:#1f2329;color:var(--fg2)}
.ib[aria-expanded=true]{background:#1f2329;color:var(--fg2)}
.sech{display:flex;align-items:center;justify-content:space-between;height:30px;padding:0 10px 0 18px;color:var(--mut);font-size:12px;flex:none}
.srch{padding:0 12px 6px}
.srch input{width:100%;height:26px;background:#1b1e23;border:1px solid var(--bd);border-radius:6px;color:var(--fg2);padding:0 8px;font:inherit;outline:0}
.srch input:focus{border-color:var(--blue)}
.spaces{flex:none;max-height:46%;overflow:auto;scrollbar-width:thin;scrollbar-color:#2c313a transparent}
.sr{display:flex;align-items:center;gap:10px;height:30px;margin:0 8px;padding:0 10px;border-radius:7px;width:calc(100% - 16px);color:var(--fg2)}
.sr:hover,.ar:hover{background:var(--hov)}
.sr.sel,.ar.sel{background:var(--sel)}
.sl{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:11px;font-weight:600;color:#fff;flex:none}
.sr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr .ah{color:var(--green);font-size:12px;display:flex;align-items:center;gap:1px}
.agents{flex:1;min-height:0;overflow:auto;border-top:1px solid var(--bd);margin-top:10px;padding-bottom:6px;scrollbar-width:thin;scrollbar-color:#2c313a transparent}
.agents .sech{padding-top:2px}
.agh{padding:8px 18px 2px;font-size:12px;color:var(--mut)}
.agh.w{color:var(--yel)}
.agh span{margin-left:4px;color:var(--mut)}
.ar{display:flex;align-items:center;gap:6px;height:30px;margin:0 8px;padding:0 10px;border-radius:7px;width:calc(100% - 16px);color:var(--fg2);position:relative}
.ar .at{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ar .at span{color:var(--mut)}
.ar .aa{font-size:12px;color:var(--mut);flex:none}
.ar .ag{width:14px;display:grid;place-items:center;flex:none}
.ar.flash{animation:rowflash 1.4s ease-out}
@keyframes rowflash{0%,60%{background:rgba(97,175,239,.22)}100%{background:var(--sel)}}
.lfoot{flex:none;border-top:1px solid var(--bd);padding:4px 0 6px}
.lrow{display:flex;align-items:center;gap:10px;height:30px;padding:0 18px;width:100%;color:var(--mut)}
.lrow:hover{color:var(--fg2);background:var(--hov)}
.lrow.on{color:var(--fg2)}
.lrow .bd{margin-left:auto;background:var(--red);color:#fff;border-radius:8px;min-width:16px;height:16px;font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 4px}
.hr{height:1px;background:var(--bd);margin:4px 0}

/* work column */
.wk{flex:1;min-width:0;display:flex;flex-direction:column}
.tabs{height:42px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px 0 12px}
.tab{display:flex;align-items:center;gap:7px;height:30px;padding:0 10px;border-radius:7px;color:var(--mut);white-space:nowrap;border:1px solid transparent}
.tab:hover{color:var(--fg2)}
.tab.on{background:var(--raise);color:var(--fg2);border-color:var(--bd)}
.tab .dt{width:6px;height:6px;border-radius:50%;background:var(--blue)}
.tab .x{display:grid;place-items:center;width:16px;height:16px;border-radius:4px;color:var(--mut);margin-right:-4px}
.tab .x:hover{background:#2c313a;color:var(--fg2)}
.tbtn{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:6px;color:var(--mut)}
.tbtn:hover,.tbtn.on{color:var(--fg2);background:#1f2329}
.body{flex:1;min-height:0;display:flex}
.termwrap{flex:1;min-width:0;padding:0 10px 8px;display:flex}
.pane{flex:1;min-width:0;display:flex;flex-direction:column;border:1px solid rgba(97,175,239,.45);border-radius:10px;background:var(--term);overflow:hidden}
.ph{height:30px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--bd);font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden}
.ph b{color:var(--fg2);font-weight:500}
.tx{flex:1;min-height:0;overflow:auto;padding:14px 16px;font:13px/1.55 var(--mono);white-space:pre-wrap;color:#c3c8d2;scrollbar-width:thin;scrollbar-color:#2c313a transparent}
.tp{color:#7fc1c8}.tc{color:var(--green)}.tcm{color:#8fc7b4}.dim{color:var(--mut)}.tg{color:var(--green)}.ty{color:var(--yel)}.tr{color:var(--red)}.tb{color:var(--blue)}.th{color:var(--fg2)}
.tu{display:inline-block;background:#1f2329;padding:2px 8px;border-radius:4px;color:var(--fg2)}
.cur{display:inline-block;width:8px;height:15px;background:#abb2bf;vertical-align:-3px}
.chg{width:260px;flex:none;border-left:1px solid var(--bd);padding:10px 14px;overflow:auto}
.chg h4{margin:0 0 8px;font-size:12px;font-weight:500;color:var(--mut)}
.chg .f{display:flex;gap:8px;font:12px/1.9 var(--mono);color:var(--fg);white-space:nowrap}
.chg .f b{color:var(--yel);font-weight:500;width:10px}.chg .f b.a{color:var(--green)}
.chg .f span{overflow:hidden;text-overflow:ellipsis}
.sb{height:28px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;font-size:12px;color:var(--mut);white-space:nowrap}
.sb .sbi{display:flex;align-items:center;gap:6px}
.sb .dm{width:6px;height:6px;border-radius:50%;background:var(--mut2)}
.cs{width:80px;height:22px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:5px;flex:none}
.cs:hover{background:#1f2329}.cs.on{background:var(--sel)}
.cs .n{font-variant-numeric:tabular-nums}
.lim{height:22px;padding:0 6px;border-radius:5px}
.lim:hover{background:#1f2329}
.lim b{color:var(--fg2);font-weight:400}

/* ---------- coordinator sidebar ---------- */
.rp{width:var(--pw);flex:none;position:relative;display:flex;flex-direction:column;min-height:0;background:var(--chrome);border-left:1px solid var(--bd)}
.dv{position:absolute;left:-4px;top:0;bottom:0;width:7px;cursor:col-resize;z-index:8}
.dv:hover::after,body.dragging .dv::after{content:"";position:absolute;left:3px;top:0;bottom:0;width:2px;background:var(--blue);opacity:.65}
.rh{height:36px;flex:none;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;border-bottom:1px solid var(--bd);min-width:0}
.rh .ht{font-weight:500;color:var(--fg2);white-space:nowrap}
.rh .hs{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rh .hs.w,.rh .hs.y{color:var(--yel)}
.rh .bk{margin-left:-6px}
.menu{position:absolute;top:34px;right:8px;width:196px;background:#1d2025;border:1px solid var(--bd);border-radius:8px;padding:4px;box-shadow:0 10px 28px rgba(0,0,0,.5);z-index:10}
.mi{display:block;width:100%;padding:5px 10px;border-radius:5px}
.mi:hover{background:var(--sel);color:var(--fg2)}
.msep{height:1px;background:var(--bd);margin:4px 2px}
.bn{flex:none;margin:8px 12px 0;padding:6px 10px;border-left:2px solid var(--yel);background:rgba(229,192,123,.07);border-radius:0 6px 6px 0;font-size:12px;color:var(--fg)}
.lk{color:var(--mut)}.lk:hover{color:var(--blue)}
.bn .lk{color:var(--yel);text-decoration:underline;text-underline-offset:2px}

.nq{flex:none;margin:8px 12px 0;padding:8px 10px;background:rgba(224,108,117,.08);border-left:2px solid var(--red);border-radius:0 6px 6px 0;transition:background .4s}
.nq.flash{background:rgba(224,108,117,.2)}
.nq-h{display:flex;align-items:baseline;gap:6px;font-size:12px;color:var(--mut);min-width:0}
.nq-h .nl{color:var(--red);font-weight:500;flex:none}
.nq-h .nw{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.nq-h .nw:hover{color:var(--fg2)}
.nq-h .na{flex:none;font-variant-numeric:tabular-nums}
.nq-t{margin-top:3px;color:var(--fg2)}
.nq-t.cl{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nq .more{font-size:12px;color:var(--mut);margin-top:1px}.nq .more:hover{color:var(--blue)}
.nq-o{margin-top:7px;display:flex;flex-wrap:wrap}
.chip{padding:3px 10px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);font-size:12px;color:var(--fg2);margin:0 6px 6px 0;line-height:1.3}
.chip:hover{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.16)}
.chip.gh{background:none;color:var(--mut);border-style:dashed}
.chip.gh:hover{color:var(--fg2)}
.nq.sent{border-left-color:var(--green);background:rgba(152,195,121,.07);display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg)}
.nq.sent span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm2{margin:6px 12px 0;font-size:12px;color:var(--mut)}.nm2:hover{color:var(--blue)}

.sw{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;margin-top:6px}
#stream{flex:1;min-height:0;overflow-y:auto;padding:6px 12px 12px;scrollbar-width:thin;scrollbar-color:#2c313a transparent}
#stream.dim{opacity:.5}
.strip{position:absolute;top:0;left:0;right:0;height:24px;display:flex;align-items:center;gap:6px;padding:0 12px;background:#1a1d23;border-bottom:1px solid var(--bd);border-top:1px solid var(--bd);font-size:12px;color:var(--fg);z-index:4;width:100%}
.strip span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip:hover{background:#1f2329}
.it{margin-top:8px}
#stream>.it:first-child{margin-top:0}
.it.afk{margin-top:2px}
.day{font-size:11px;color:var(--mut);margin-top:12px}
.empty{color:var(--mut);padding:6px 0}
.cl-b{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:12px;width:100%;height:22px}
.cl-b:hover{color:var(--fg2)}
.cl-l{margin:2px 0 4px 6px;padding-left:10px;border-left:1px solid var(--bd)}
.cr{display:flex;align-items:center;gap:8px;font-size:12px;height:22px;color:var(--fg)}
.cr .crt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr .crt span{color:var(--mut)}
.cr .crs{color:var(--mut);flex:none}
.um{background:var(--raise);border-radius:6px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--fg2)}
.um .tm{float:right;margin:1px 0 0 10px;font-size:11px;color:var(--mut);white-space:nowrap}
.um .an{display:block;font-size:12px;color:var(--mut);margin-bottom:1px;white-space:normal}
.rpl{position:relative;color:var(--fg)}
.rpl p{margin:0}.rpl p+p{margin-top:2px}
.rpl ul{margin:2px 0 0;padding-left:18px}
.rpl b{color:var(--fg2);font-weight:600}
.rpl code,.nq code{font-family:var(--mono);font-size:12px;background:#1f2329;padding:0 4px;border-radius:4px}
.rpl .rt{position:absolute;right:0;top:0;font-size:11px;color:var(--mut);opacity:0;background:var(--chrome);padding-left:6px;transition:opacity .12s}
.rpl:hover .rt{opacity:1}
.note{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:8px}
.note::before,.note::after{content:none}

.rc{position:relative;margin-left:12px;padding:0 0 0 12px}
.rc::before{content:"";position:absolute;left:0;top:-2px;height:17px;width:11px;border-left:1px solid #383e49;border-bottom:1px solid #383e49;border-bottom-left-radius:6px}
.rc.nochain::before{display:none}
.rc-hd{display:block;padding:5px 0 5px 0;border-radius:6px;cursor:pointer;position:relative}
.rc-hd:hover,.rc.flash .rc-hd{background:rgba(255,255,255,.035)}
.rc.flash .rc-hd{background:rgba(97,175,239,.14)}
.rc-hd{transition:background .5s}
.rc-1{display:flex;align-items:center;gap:8px;min-height:20px;padding-right:2px}
.rc-1 .g{width:14px;height:14px;display:grid;place-items:center;flex:none}
.rc-1 .ttl{flex:1;min-width:0;font-weight:500;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-1 .r{flex:none;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);white-space:nowrap}
.rc-1 .dur{font-variant-numeric:tabular-nums}
.acts{display:none;gap:10px}
.acts button{color:var(--mut);font-size:12px}
.acts button:hover{color:var(--blue)}
.rc:hover .acts,.rc:focus-within .acts,.rc.sel .acts{display:flex}
.rc:hover .spn,.rc:focus-within .spn,.rc.sel .spn,.rc:hover .dur,.rc:focus-within .dur,.rc.sel .dur{display:none}
.rc-2{padding-left:22px;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:2px}
.rc.blocked .rc-2{color:var(--yel)}.rc.question .rc-2{color:var(--red)}
.rc.running .rc-2{color:#9aa1ad}
.rc .lq{cursor:pointer}.rc .lq:hover{text-decoration:underline;text-underline-offset:2px}
.rc-tr{margin:4px 0 2px 22px;display:grid;grid-template-columns:36px 1fr;gap:3px 8px;font-size:12px;color:var(--fg)}
.rc-tr .tt{color:var(--mut);font-variant-numeric:tabular-nums}
.rc-tr .why{color:var(--mut)}
.rc-tr .dc{color:var(--pur)}
.rc-lk{margin:6px 0 2px 22px;display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;font-size:12px}
.rc-lk i{font-style:normal;color:var(--mut2)}
.echo{display:flex;align-items:flex-start;gap:7px;font-size:12px;color:var(--mut)}
.echo .eg{margin-top:2px}
.echo .et{flex:1;min-width:0}
.echo .up{flex:none;color:var(--mut);width:18px;height:18px;border-radius:4px;display:grid;place-items:center}
.echo .up:hover{background:#1f2329;color:var(--blue)}

.wl{flex:none;height:22px;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:12px;color:var(--mut)}
.wl .e{margin-left:auto;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:3px}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--yel);animation:blink 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.g-run{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.cmp{flex:none;padding:4px 12px 12px}
.ctxc{display:flex;align-items:center;gap:6px;margin-bottom:6px;padding:2px 3px 2px 8px;background:var(--raise);border-radius:6px;font-size:12px;color:var(--mut)}
.ctxc .ct{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.ctxc .ib{width:20px;height:20px}
.cb{position:relative;background:#1b1e23;border:1px solid var(--bd);border-radius:8px}
.cb:focus-within{border-color:rgba(97,175,239,.7)}
#ta{display:block;width:100%;resize:none;border:0;outline:0;background:transparent;color:var(--fg2);font:inherit;line-height:18px;padding:9px 38px 9px 10px;height:36px;max-height:126px;overflow-y:auto;scrollbar-width:thin}
#ta::placeholder{color:var(--mut2)}
.send{position:absolute;right:6px;bottom:5px;width:24px;height:24px;display:grid;place-items:center;border-radius:6px;color:var(--blue)}
.send:hover:not(:disabled){background:rgba(97,175,239,.14)}
.send:disabled{opacity:.3;cursor:default}
.offbar{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border:1px dashed var(--bd);border-radius:8px;color:var(--mut)}
.offbar .sp{flex:1}
.startb{padding:3px 12px;border-radius:6px;background:rgba(97,175,239,.16);color:#bcdcf8;border:1px solid rgba(97,175,239,.35)}
.startb:hover{background:rgba(97,175,239,.26)}

/* journal */
.jv{flex:1;min-height:0;display:flex;flex-direction:column}
.jh{flex:none;display:flex;flex-direction:column;gap:6px;padding:4px 12px 8px;border-bottom:1px solid var(--bd)}
.jh input[type=search]{width:100%;height:28px;background:#1b1e23;border:1px solid var(--bd);border-radius:6px;color:var(--fg2);padding:0 9px;font:inherit;outline:0}
.jh input[type=search]:focus{border-color:var(--blue)}
.chk{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut);cursor:pointer;width:max-content}
.chk input{accent-color:var(--blue);margin:0}
.jl{flex:1;min-height:0;overflow-y:auto;padding-bottom:10px;scrollbar-width:thin;scrollbar-color:#2c313a transparent}
.jd{padding:10px 12px 3px;font-size:11px;color:var(--mut)}
.jr{display:grid;grid-template-columns:36px 14px 1fr;gap:0 8px;padding:4px 12px;font-size:12px;cursor:pointer;align-items:start}
.jr:hover{background:var(--hov)}
.jr .t{color:var(--mut);font-variant-numeric:tabular-nums}
.jr .g{height:17px;display:grid;place-items:center}
.jr .x{color:var(--fg);min-width:0;overflow-wrap:anywhere}
.jr .x i{font-style:normal;color:var(--mut)}
.jr.sys .x{color:var(--mut)}
.jraw{margin:0 12px 4px 58px;padding:6px 8px;background:#101215;border-radius:6px;display:grid;grid-template-columns:auto 1fr;gap:1px 10px;font:11px/1.5 var(--mono);overflow:hidden}
.jraw dt{color:var(--mut)}.jraw dd{margin:0;color:var(--fg);overflow-wrap:anywhere}
.jempty{padding:14px 12px;color:var(--mut)}

.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:#2a2f38;color:#e6e9ef;padding:6px 12px;border-radius:8px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:50;border:1px solid #3a404b}
.toast.on{opacity:1}

@media (prefers-reduced-motion:reduce){
  .g-run{animation:none}
  .dots i{animation:none;opacity:.8}
  .ar.flash{animation:none;background:rgba(97,175,239,.22)}

function mk(name){
  S={scn:name,coord:'idle',turn:null,queue:[],items:[],recs:{},qs:[],events:[],ctx:null,view:'stream',jf:'',jsys:false,jopen:{},menu:false,
     main:{kind:'space',key:'herdr-kit'},sel:null,yopen:false,needsAll:false,qmore:{},tabs:{},tabSel:{},sched:[],uid:0,lastAsk:''};
  t0=Date.now();
  SEEDS[name]();
  Object.values(S.recs).forEach(r=>r.prog.forEach((tx,i)=>after(6000*(i+1),()=>progress(r,tx))));
  const ta=$('#ta');ta.value='';autosize();

/* ================= derived ================= */
const recsInOrder=()=>S.items.filter(i=>i.type==='receipt').map(i=>S.recs[i.rid]);
const inFlight=()=>recsInOrder().filter(r=>['queued','running','blocked','question'].includes(r.state));
const openQs=()=>S.qs.filter(q=>q.state==='open');
function agentRows(){
  const rs=Object.values(S.recs);const byU=(a,b)=>b.upd-a.upd;
  return [...rs.filter(r=>r.state==='running').sort(byU).map(r=>({r,w:1})),
          ...rs.filter(r=>r.agent&&r.state!=='running'&&r.state!=='queued').sort(byU).map(r=>({r,w:0}))];
}
function curSpace(){
  const m=S.main;
  if(m.kind==='space')return m.key;
  if(m.kind==='agent'&&m.key==='coord')return 'coordinator';
  return (S.recs[m.key]||{}).space||'herdr-kit';
}
function durText(r){
  const n=clock();
  if(r.state==='done')return age((r.endedAt||n)-r.startedAt);
  if(r.state==='running'||r.state==='queued')return mmss(n-r.startedAt);
  return age(n-r.startedAt);
}
function stateWord(){
  if(S.coord==='off')return ['Off',''];
  if(S.coord==='restarting')return ['Restarting…','w'];
  if(S.turn)return ['Working · '+mmss(clock()-S.turn.start),'w'];
  if(S.coord==='degraded')return ['Degraded','y'];
  return ['Idle',''];
}

/* ================= actions on state ================= */
function progress(r,text){
  if(r.state!=='running')return;
  r.line=text;r.upd=clock();addTrace(r,clock(),'progress',text);render('auto');
}
function echoFor(r,verb){
  const idx=S.items.findIndex(i=>i.type==='receipt'&&i.rid===r.id);
  if(idx<0||idx>=S.items.length-1)return;
  S.items=S.items.filter(i=>!(i.type==='echo'&&i.rid===r.id));
  S.items.push({type:'echo',id:nid('c'),rid:r.id,text:`${r.ws} ${verb} — ${r.line}`,st:r.state});
}
function finish(r,outcome){
  if(r.state==='done')return;
  r.state='done';r.endedAt=clock();r.upd=r.endedAt;r.line=outcome;
  addTrace(r,r.endedAt,'report',outcome,'done');
  addTrace(r,r.endedAt,'closed','Closed — '+outcome);
  echoFor(r,'finished');
  render('auto');
}
function answerQ(q,label,opt,custom){
  if(q.state!=='open')return;
  q.state='sent';q.sentLabel=label;
  if(S.ctx===q.id)S.ctx=null;
  const r=S.recs[q.rid];const n=clock();
  addEv('Today',n,'question.answered','done','Answered: '+label,r.ws,{question:q.id,via:custom?'reply':'option'});
  r.state='running';r.upd=n;r.line='Answer received; resuming';addTrace(r,n,'progress','Answer received: '+label);
  after(2400,()=>{S.qs=S.qs.filter(x=>x!==q);render('auto')});
  const o=opt||{outcome:'Done as you asked',quick:false};
  if(o.progress)after(o.quick?2000:5500,()=>progress(r,o.progress));
  after(o.quick?3500:12000,()=>finish(r,o.outcome));
}
function userMsg(text,answerTo){
  const m={type:'user',id:nid('u'),text,t:null,sending:true,answerTo:answerTo||''};
  S.items.push(m);
  after(700,()=>{m.sending=false;m.t=clock();addEv('Today',m.t,'coord.sent','in',text,answerTo||'',{from:'person'});render('auto')});
  return m;
}
function send(){
  const ta=$('#ta');const text=ta.value.trim();
  if(!text||S.coord==='off')return;
  const q=S.ctx?S.qs.find(x=>x.id===S.ctx&&x.state==='open'):null;
  const m=userMsg(text,q?S.recs[q.rid].ws:'');
  ta.value='';autosize();
  if(q){S.queue.push({kind:'answer',mid:m.id,text});answerQ(q,text,null,true)}
  else S.queue.push({kind:'ask',mid:m.id,text});
  S.ctx=null;
  render('bottom');startTurn();
}
function startTurn(){
  if(S.turn||!S.queue.length||S.coord==='off'||S.coord==='restarting')return;
  runJob(S.queue.shift(),0,1);
}
function runJob(job,offset,mult){
  const steps=job.kind==='answer'?[[0,'Reading inbox'],[1200,'Writing reply']]:[[0,'Reading inbox'],[1600,'Placing task'],[3400,'Writing reply']];
  const end=job.kind==='answer'?2600:5000;
  S.turn={step:steps[0][1],start:clock()-offset,job};
  steps.forEach(([at,label],i)=>{
    const fn=()=>{S.turn.step=label;if(label==='Placing task')placeTask(job);render('auto')};
    if(i===0)return;
    const t=at*mult-offset;
    t<=0?fn():after(t,fn);
  });
  const ft=end*mult-offset;
  after(Math.max(ft,50),()=>endTurn(job));
}
function insertAfter(ref,item){
  const i=S.items.indexOf(ref);
  if(i<0)S.items.push(item);else S.items.splice(i+1,0,item);
}
function inferTask(text){
  const t=text.toLowerCase();let space='herdr-kit',why='small change in the main checkout, no worktree needed',role='default';
  if(/calendar|todo/.test(t)){space='todo';why='design-only work, checkout clean';role='design'}
  else if(/md-search|search/.test(t)){space='md-search';why='lives in its own space, checkout clean'}
  else if(/deploy|install/.test(t)){why='deploys run on the main checkout';role='deep'}
  else if(/research|compare|look into|how hard|whats|what's/.test(t)){why='read-only research, no edits'}
  let w=text.replace(/^(can you|could you|please|pls|i'?d like (to )?|i want (to )?|lets|let's)\s+/i,'').replace(/[.!?]+$/,'').split(/\s+/).slice(0,6);
  while(w.length>2&&/^(in|on|of|the|a|an|to|and|for|with|at|by|so)$/i.test(w[w.length-1]))w.pop();
  let title=w.join(' ');title=title.charAt(0).toUpperCase()+title.slice(1);
  return {space,why,role,title:title||'New task'};
}
function placeTask(job){
  const msg=S.items.find(i=>i.id===job.mid);
  const k=inferTask(job.text);const n=clock();
  const r={id:nid('r'),ws:k.title,space:k.space,state:'queued',line:'Placing in '+k.space+'…',agent:true,role:k.role,trace:[],startedAt:n,endedAt:null,askText:job.text,open:false,prog:[],upd:n,doneOutcome:''};
  S.recs[r.id]=r;job.rid=r.id;
  const item={type:'receipt',rid:r.id};insertAfter(msg,item);
  addEv('Today',n,'ws.opened','dot','Workstream opened',r.ws,{ws:r.id});
  addEv('Today',n,'res.intent','dot','Resource intent recorded',r.ws,{ws:r.id},true);
  addTrace(r,n,'placed','Placed in '+k.space+' — '+k.why);
  after(1800,()=>{if(r.state==='queued'){r.line='Placed in '+k.space+'; starting';render('auto')}});
  after(5000,()=>{
    if(r.state!=='queued')return;
    r.state='running';r.upd=clock();r.line=(k.role==='design'?'Design':'Delegate')+' agent started in '+k.space;
    addTrace(r,clock(),'start',r.line);
    addEv('Today',clock(),'task.launch_details','dot','Launch details recorded',r.ws,{ws:r.id},true);
    render('auto');
  });
  after(10500,()=>progress(r,'Reading the relevant code in '+k.space));
  after(16000,()=>progress(r,'Drafting the change; checks next'));
  after(22000,()=>finish(r,'Done; change committed, checks pass'));
}
function endTurn(job){
  if(!S.turn||S.turn.job!==job)return;
  const r=job.rid?S.recs[job.rid]:null;
  const txt=job.kind==='answer'?'Passed that on to the delegate.':`Placed **${r?r.ws:'the task'}** in \`${r?r.space:'herdr-kit'}\`. I'll report back when it's done.`;
  const ref=r?S.items.find(i=>i.type==='receipt'&&i.rid===r.id):S.items.find(i=>i.id===job.mid);
  const n=clock();
  insertAfter(ref,{type:'reply',id:nid('p'),t:n,md:txt});
  addEv('Today',n,'coord.replied','out',txt.replace(/[*`]/g,''),r?r.ws:'',{});
  addEv('Today',n,'coord.turn','dot','Coordinator turn finished ('+((n-S.turn.start)/1000).toFixed(1)+'s)','',{},true);
  S.turn=null;render('auto');startTurn();
}
function restart(){
  S.menu=false;S.coord='restarting';S.turn=null;S.queue=[];
  addEv('Today',clock(),'watcher.restart','dot','Coordinator restart requested','',{},true);
  render('auto');
  after(2200,()=>{S.coord='idle';S.items.push({type:'note',id:nid('n'),text:'Coordinator restarted.'});
    addEv('Today',clock(),'watcher.ready','dot','Coordinator ready','',{},true);render('bottom');startTurn()});
}

    :`<span class="ht">Coordinator</span><span class="hs ${c}" id="hs">${esc(w)}</span>`)
    +`<span class="sp"></span><button class="ib" data-act="menu" aria-haspopup="menu" aria-expanded="${S.menu}" aria-label="More">${ico('more',16)}</button><button class="ib" data-act="panel-close" aria-label="Close coordinator sidebar">${ico('close',15)}</button>`;
  $('#menu').innerHTML=S.menu?`<div class="menu" role="menu"><button class="mi" role="menuitem" data-act="m-journal">Journal</button><button class="mi" role="menuitem" data-act="m-raw">Open raw coordinator</button><div class="msep"></div><button class="mi" role="menuitem" data-act="m-clear">Clear context</button><button class="mi" role="menuitem" data-act="m-restart">Restart</button></div>`:'';
}
function renderBanner(){
  const b=$('#banner');b.hidden=S.coord!=='degraded';
  b.className='bn';
  b.innerHTML=S.coord==='degraded'?`Watcher is not responding — delegates keep running, replies may be late. <button class="lk" data-act="restart">Restart</button>`:'';
}
function qHTML(q){
  const r=S.recs[q.rid];
  if(q.state==='sent')return `<div class="nq sent" data-qid="${q.id}">${gl('done',13)}<span>Sent: ${esc(q.sentLabel)} — resuming</span></div>`;
  const long=q.text.length>140;const ex=!!S.qmore[q.id];
  return `<div class="nq" data-qid="${q.id}">
    <div class="nq-h"><span class="nl">Needs you</span><button class="nw" data-act="go-rec" data-rid="${r.id}" title="Show receipt">· ${esc(r.ws)}</button><span class="na" data-since="${q.since}">${age(clock()-q.since)}</span></div>
    <div class="nq-t ${long&&!ex?'cl':''}">${esc(q.text)}</div>${long?`<button class="more" data-act="q-more" data-qid="${q.id}">${ex?'less':'more'}</button>`:''}
    <div class="nq-o">${q.opts.map((o,i)=>`<button class="chip" data-act="q-opt" data-qid="${q.id}" data-oi="${i}">${esc(o.label)}</button>`).join('')}<button class="chip gh" data-act="q-reply" data-qid="${q.id}">Reply…</button></div></div>`;
}
function renderNeeds(){
  const qs=S.qs.slice().sort((a,b)=>b.since-a.since);
  const vis=S.needsAll?qs:qs.slice(0,2);const more=qs.length-2;
  $('#needs').innerHTML=vis.map(qHTML).join('')+(more>0?`<button class="nm2" data-act="needs-more">${S.needsAll?'Show less':more+' more'}</button>`:'');
}
function recHTML(r,afk){
  const q=S.qs.find(x=>x.rid===r.id&&x.state==='open');
  const l2=q?`<span class="lq" data-act="flash-needs">${esc(r.line)} ↑</span>`:esc(r.line);
  let h=`<div class="it rc ${r.state} ${r.open?'open':''} ${S.sel===r.id?'sel':''} ${afk?'afk':'nochain'}" id="rc-${r.id}">
   <div class="rc-hd" role="button" tabindex="0" data-act="rc-toggle" data-rid="${r.id}" aria-expanded="${r.open}">
    <div class="rc-1"><span class="g">${gl(r.state)}</span><span class="ttl">${esc(r.ws)}</span>
      <span class="r"><span class="acts"><button data-act="open-term" data-rid="${r.id}">Open terminal</button><button data-act="rc-toggle" data-rid="${r.id}">Trace</button></span><span class="spn">${esc(r.space)}</span><span class="dur" data-dur="${r.id}">${durText(r)}</span></span></div>
    <div class="rc-2" title="${esc(r.line)}">${l2}</div></div>`;
  if(r.open){
    h+=`<div class="rc-tr">`+r.trace.map(e=>`<span class="tt">${hhmm(e.t)}</span><span>${e.kind==='decision'?'<span class="dc">◆</span> ':''}${esc(e.text)}${e.kind==='decision'&&e.extra?` <span class="why">— ${esc(e.extra)}</span>`:''}</span>`).join('')+`</div>
    <div class="rc-lk"><button class="lk" data-act="open-term" data-rid="${r.id}">Open terminal</button><i>·</i><button class="lk" data-act="show-space" data-rid="${r.id}">Show space</button><i>·</i><button class="lk" data-act="doc" data-doc="brief" data-rid="${r.id}">Brief</button><i>·</i><button class="lk" data-act="doc" data-doc="result" data-rid="${r.id}">Result</button></div>`;
  }
  return h+'</div>';
}
function itemHTML(it,prev){
  switch(it.type){
    case 'coll':{
      return `<div class="it"><button class="cl-b" data-act="coll-toggle" aria-expanded="${S.yopen}">${ico(S.yopen?'down':'right',12)}<span>Yesterday — ${YEST.length} asks, all done</span></button>`
        +(S.yopen?`<div class="cl-l">`+YEST.map(([ws,sp,out])=>`<div class="cr">${gl('done',12)}<span class="crt">${esc(ws)}<span> — ${esc(out)}</span></span><span class="crs">${esc(sp)}</span></div>`).join('')+'</div>':'')+'</div>';
    }
    case 'day':return `<div class="it day">${esc(it.label)}</div>`;
    case 'user':return `<div class="it um"><span class="tm">${it.sending?'sending…':hhmm(it.t)}</span>${it.answerTo?`<span class="an">Answering: ${esc(it.answerTo)}</span>`:''}${esc(it.text)}</div>`;
    case 'receipt':return recHTML(S.recs[it.rid],prev&&prev.type==='user');
    case 'reply':return `<div class="it rpl"><span class="rt">${hhmm(it.t)}</span>${md(it.md)}</div>`;
    case 'echo':return `<div class="it echo"><span class="eg">${gl(it.st,12)}</span><span class="et">${esc(it.text)}</span><button class="up" data-act="echo-go" data-rid="${it.rid}" aria-label="Show receipt" title="Show receipt">${ico('up',12)}</button></div>`;
    case 'note':return `<div class="it note">${esc(it.text)}</div>`;
  }
  return '';
}
function renderStream(mode='auto'){
  const st=$('#stream');
  const was=st.scrollHeight-st.scrollTop-st.clientHeight<24;const top=st.scrollTop;
  st.innerHTML=S.items.length?S.items.map((it,i)=>itemHTML(it,S.items[i-1])).join(''):'<div class="empty">Nothing in flight. Ask for something below.</div>';
  st.classList.toggle('dim',S.coord==='off');
  if(mode==='bottom'||(mode==='auto'&&was))st.scrollTop=st.scrollHeight;else st.scrollTop=top;
  updateStrip();
}
function updateStrip(){
  const s=$('#strip');const st=$('#stream');
  if(S.view!=='stream'||!U.panel){s.hidden=true;return}
  const box=st.getBoundingClientRect();const hid=[];
  inFlight().forEach(r=>{
    const el=document.getElementById('rc-'+r.id);if(!el)return;
    const b=el.getBoundingClientRect();
    if(b.bottom<box.top+2||b.top>box.bottom-2)hid.push(r);
  });
  if(!hid.length){s.hidden=true;return}
  s.hidden=false;s.dataset.rid=hid[0].id;
  const eb=document.getElementById('rc-'+hid[0].id).getBoundingClientRect();
  const html=`<span><b style="font-weight:500">${hid.length} in flight</b> — ${esc(hid.map(r=>r.ws).join(', '))}</span><span style="margin-left:auto;flex:none;color:var(--mut)">${ico(eb.bottom<box.top+2?'up':'down',12)}</span>`;
  if(s.dataset.h!==html){s.dataset.h=html;s.innerHTML=html}
}
function renderJournalList(){
  const f=S.jf.toLowerCase();
  const evs=S.events.filter(e=>(S.jsys||!e.sys)&&(!f||(e.text+' '+e.ws+' '+e.type).toLowerCase().includes(f)))
    .sort((a,b)=>(a.day===b.day?0:a.day==='Today'?-1:1)||b.t-a.t);
  let h='',cur='';
  evs.forEach(e=>{
    if(e.day!==cur){cur=e.day;h+=`<div class="jd">${cur}</div>`}
    h+=`<div class="jr ${e.sys?'sys':''}" role="button" tabindex="0" data-act="jrow" data-eid="${e.id}" aria-expanded="${!!S.jopen[e.id]}"><span class="t">${hhmm(e.t)}</span><span class="g">${gl(e.glyph,13)}</span><span class="x">${esc(e.text)}${e.ws?` <i>(${esc(e.ws)})</i>`:''}</span></div>`;
    if(S.jopen[e.id])h+=`<dl class="jraw"><dt>ts</dt><dd>${e.day==='Today'?'today ':'yesterday '}${hhmm(e.t)}</dd><dt>type</dt><dd>${esc(e.type)}</dd>${Object.entries(e.raw).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
  });
  $('#jlist').innerHTML=h||'<div class="jempty">No events match.</div>';
}
function renderWorking(){
  const w=$('#wl');
  if(!S.turn){w.hidden=true;return}
  w.hidden=false;
  w.innerHTML=`<span class="dots"><i></i><i></i><i></i></span><span>${esc(S.turn.step)}</span><span class="e" id="wle">${mmss(clock()-S.turn.start)}</span>`;
}
function renderComposer(){
  const off=S.coord==='off';
  $('#cbox').hidden=off;$('#offbar').hidden=!off;
  const q=S.ctx?S.qs.find(x=>x.id===S.ctx):null;
  $('#ctx').innerHTML=q&&!off?`<div class="ctxc"><span>Answering:</span><span class="ct">${esc(q.text)}</span><button class="ib" data-act="ctx-x" aria-label="Remove context">${ico('close',11)}</button></div>`:'';
  $('#send').disabled=!$('#ta').value.trim();
}
function renderPanel(mode){
  if(!U.panel)return;
  renderHeader();renderBanner();renderNeeds();
  const j=S.view==='journal';
  $('#stream').hidden=j;$('#journal').hidden=!j;
  if(j){$('#strip').hidden=true;renderJournalList();$('#jsys').checked=S.jsys}
  else renderStream(mode);
  renderWorking();renderComposer();
}
function render(mode='auto'){renderDemo();applyU();renderLeft();renderMain();renderStatus();renderPanel(mode)}

function tickText(){
  document.querySelectorAll('[data-dur]').forEach(el=>{const r=S.recs[el.dataset.dur];if(r)el.textContent=durText(r)});
  document.querySelectorAll('[data-since]').forEach(el=>{el.textContent=age(clock()-(+el.dataset.since))});
  document.querySelectorAll('[data-aage]').forEach(el=>{const r=S.recs[el.dataset.aage];if(r)el.textContent=age(clock()-r.upd)});
  const hs=$('#hs');if(hs&&S.view==='stream'){const [w,c]=stateWord();hs.textContent=w;hs.className='hs '+c}
  const e=$('#wle');if(e&&S.turn)e.textContent=mmss(clock()-S.turn.start);
}

/* ================= misc ui ================= */
let tt;
function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),2200)}
function autosize(){const ta=$('#ta');ta.style.height='36px';ta.style.height=Math.min(Math.max(ta.scrollHeight,36),126)+'px'}
function scrollToRec(id){
  if(!U.panel){U.panel=true;render('bottom')}
  if(S.view!=='stream'){S.view='stream';renderPanel('bottom')}
  const el=document.getElementById('rc-'+id);if(!el)return;
  el.scrollIntoView({block:'center',behavior:RM?'auto':'smooth'});
  el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1500);
}
function openTerm(id){
  const r=S.recs[id];S.main={kind:'agent',key:id};
  render('keep');
  const row=document.querySelector(`.ar[data-akey="${id}"]`);
  if(row){row.classList.add('flash');row.scrollIntoView({block:'nearest'})}
  else toast('Session released — showing the last output');
}

/* ================= one delegated click handler ================= */
const A={
  scn:el=>{mk(el.dataset.v);render('bottom')},
  width:el=>{const was=U.panel;U.w=+el.dataset.v;U.panel=true;render(was?'keep':'bottom')},
  reset:()=>{U={...U0};mk(S.scn);render('bottom')},
  finish:()=>{
    const r=recsInOrder().find(x=>x.state==='running');
    if(!r){toast('Nothing is running');return}
    finish(r,r.doneOutcome||'Done; change committed, checks pass');
  },
  'panel-toggle':()=>{U.panel=!U.panel;render(U.panel?'bottom':'keep')},
  'panel-close':()=>{U.panel=false;render('keep')},
  menu:()=>{S.menu=!S.menu;renderHeader()},
  'm-journal':()=>{S.menu=false;S.view='journal';renderPanel('keep')},
  'm-raw':()=>{S.menu=false;S.main={kind:'agent',key:'coord'};render('keep');const row=document.querySelector('.ar[data-akey="coord"]');if(row)row.classList.add('flash')},
  'm-clear':()=>{
    S.menu=false;S.items.push({type:'note',id:nid('n'),text:'Context cleared — fresh coordinator session.'});
    addEv('Today',clock(),'coord.cleared','dot','Context cleared; fresh coordinator session','',{});
    render('bottom');
  },
  'm-restart':()=>restart(),
  restart:()=>restart(),
  start:()=>{
    S.coord='idle';S.items.push({type:'note',id:nid('n'),text:'Coordinator started.'});
    addEv('Today',clock(),'watcher.started','dot','Coordinator started','',{},true);
    render('bottom');startTurn();
  },
  'journal-back':()=>{S.view='stream';renderPanel('bottom')},
  jsys:el=>{S.jsys=el.checked;renderJournalList()},
  jrow:el=>{S.jopen[el.dataset.eid]=!S.jopen[el.dataset.eid];renderJournalList()},
  'rc-toggle':el=>{const r=S.recs[el.dataset.rid];r.open=!r.open;S.sel=r.id;renderStream('keep');if(r.open){const n=document.getElementById('rc-'+r.id);if(n)n.scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}},
  'open-term':el=>openTerm(el.dataset.rid),
  'show-space':el=>{S.main={kind:'space',key:S.recs[el.dataset.rid].space};render('keep')},
  doc:el=>{S.main={kind:'doc',key:el.dataset.rid,doc:el.dataset.doc};render('keep')},
  'echo-go':el=>scrollToRec(el.dataset.rid),
  'strip-go':el=>scrollToRec(el.dataset.rid),
  'go-rec':el=>scrollToRec(el.dataset.rid),
  'flash-needs':()=>{document.querySelectorAll('.nq').forEach(n=>{n.classList.add('flash');setTimeout(()=>n.classList.remove('flash'),1200)})},
  'q-opt':el=>{
    const q=S.qs.find(x=>x.id===el.dataset.qid);if(!q||q.state!=='open')return;
    const o=q.opts[+el.dataset.oi];
    userMsg(o.label,S.recs[q.rid].ws);
    answerQ(q,o.label,o,false);
    render('bottom');
  },
  'q-reply':el=>{S.ctx=el.dataset.qid;renderComposer();$('#ta').focus()},
  'ctx-x':()=>{S.ctx=null;renderComposer()},
  'q-more':el=>{S.qmore[el.dataset.qid]=!S.qmore[el.dataset.qid];renderNeeds()},
  'needs-more':()=>{S.needsAll=!S.needsAll;renderNeeds();updateStrip()},
  send:()=>send(),
  'coll-toggle':()=>{S.yopen=!S.yopen;renderStream('keep')},
  space:el=>{S.main={kind:'space',key:el.dataset.key};render('keep')},
  agent:el=>{S.main={kind:'agent',key:el.dataset.key};render('keep');const row=document.querySelector(`.ar[data-akey="${el.dataset.key}"]`);if(row)row.classList.add('flash')},
  tab:el=>{if(S.main.kind==='space'){S.tabSel[S.main.key]=el.dataset.id;renderMain()}},
  'tab-close':el=>{
    if(S.main.kind!=='space'){S.main={kind:'space',key:curSpace()};render('keep');return}
    const sp=S.main.key;const ts=tabsFor(sp);if(ts.length<2)return;
    const i=ts.findIndex(t=>t.id===S.tabSel[sp]);ts.splice(i,1);S.tabSel[sp]=ts[Math.max(0,i-1)].id;renderMain();
  },
  'tab-add':()=>{
    if(S.main.kind!=='space')S.main={kind:'space',key:curSpace()};
    const sp=S.main.key;const ts=tabsFor(sp);const id='t'+nid('');
    ts.push({id,label:'fish',kind:'fish'});S.tabSel[sp]=id;render('keep');
  },
  changes:()=>{U.chg=!U.chg;renderMain()},
  'ls-toggle':()=>{U.ls=!U.ls;render('keep')},
  search:()=>{
    U.srch=!U.srch;if(!U.srch)U.sf='';
    $('#srch').hidden=!U.srch;$('#b-search').setAttribute('aria-expanded',U.srch);
    if(U.srch)$('#srchin').focus();else $('#srchin').value='';
    renderLeft();
  },
  toast:el=>toast(el.dataset.msg)
};
document.addEventListener('click',e=>{
  if(S.menu&&!e.target.closest('.menu')&&!e.target.closest('[data-act="menu"]')){S.menu=false;renderHeader()}
  const el=e.target.closest('[data-act]');
  if(!el)return;
  const f=A[el.dataset.act];
  if(f)f(el,e);
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ')return;
  const el=e.target;
  if(!el.matches||!el.matches('[data-act][tabindex]'))return;
  if(el.tagName==='BUTTON'||el.tagName==='TEXTAREA'||el.tagName==='INPUT')return;
  e.preventDefault();el.click();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='ta'){autosize();$('#send').disabled=!t.value.trim()}
  else if(t.id==='jf'){S.jf=t.value;renderJournalList()}
  else if(t.id==='srchin'){U.sf=t.value;renderLeft()}
});

/* divider drag */
let drag=false;
document.addEventListener('pointerdown',e=>{
  if(e.button!==0||!e.target.closest('#dv'))return;
  drag=true;document.body.classList.add('dragging');e.preventDefault();
});
document.addEventListener('pointermove',e=>{
  if(!drag)return;
  const r=$('#win').getBoundingClientRect();
  const lsw=U.ls?268:0;
  const max=Math.max(300,Math.min(720,r.width-lsw-360));
  U.w=Math.round(Math.min(max,Math.max(300,r.right-e.clientX)));
  applyU();renderDemo();updateStrip();
});
document.addEventListener('pointerup',()=>{if(drag){drag=false;document.body.classList.remove('dragging');renderDemo()}});
document.addEventListener('dblclick',e=>{if(e.target.closest('#dv')){U.w=368;applyU();renderDemo()}});
$('#stream').addEventListener('scroll',updateStrip,{passive:true});

/* ================= boot ================= */
$('#logo').innerHTML='<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect width="20" height="20" rx="5" fill="#2a2f38"/><path d="M6 5v10M14 5v10M6 10h8" stroke="#e8eaef" stroke-width="1.8" stroke-linecap="round"/></svg>';
$('#b-search').innerHTML=ico('search',15);
$('.brand [data-act="ls-toggle"]').innerHTML=ico('side',15);
$('#b-newsp').innerHTML=ico('plus',14);$('#b-hist').innerHTML=ico('clock',15);
$('#b-set').innerHTML=ico('gear',16)+'<span>Settings</span>';
$('#b-mach').innerHTML=ico('plus',16)+'<span>Add machine</span>';
$('#send').innerHTML=ico('send',15);
mk('needs');render('bottom');
setInterval(()=>{pump();tickText();updateStrip()},250);
window.addEventListener('load',()=>renderStream('bottom'));
window.__coord={get S(){return S},get U(){return U},mk,render};
})();
</script>
</body>
</html>
