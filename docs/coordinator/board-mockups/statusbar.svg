<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="system-ui, 'Geist', sans-serif" font-size="11.8">
  <!-- Illustrative colours (graphite-like). Real build reads theme(): chrome, border, muted, dim, accent, working, blocked, hover. -->
  <defs>
    <symbol id="run" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3" fill="currentColor"/><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="12" cy="20" r="2"/><path d="M6.7 7.3l3.2 2.9M17.3 7.3l-3.2 2.9M12 15v3"/></g></symbol>
    <symbol id="off" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="12" cy="20" r="2"/><path d="M6.7 7.3l3.2 2.9M17.3 7.3l-3.2 2.9M12 15v3" stroke-dasharray="1.6 2.4"/></g></symbol>
    <symbol id="deg" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 9.8v2.9"/><circle cx="12" cy="14.7" r=".5" fill="currentColor"/><circle cx="4.5" cy="5.5" r="1.8"/><circle cx="19.5" cy="5.5" r="1.8"/><circle cx="12" cy="21" r="1.8"/><path d="M6 7l2.6 2.4M18 7l-2.6 2.4M12 16.5v2.7"/></g></symbol>
    <symbol id="spin" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <style>
      .bg{fill:#101114}.bd{stroke:#25282c;stroke-width:1}.m{fill:#a9adb3}.d{fill:#8b8f95}.fg{fill:#e8e9eb}
      .lbl{fill:#e8e9eb;font-size:12px}.note{fill:#8b8f95;font-size:11px}
      .acc{color:#3b82f6}.wrk{color:#d9a441}.blk{color:#ef5350}.dim{color:#8b8f95}
      .btn{fill:none;stroke:#3b82f6;stroke-width:1;rx:3}
    </style>
  </defs>
  <rect width="940" height="560" fill="#2b2d31"/>
  <text x="16" y="24" class="lbl" font-weight="600">herdr-kit-coord status strip (block: 280 px wide x 28 px high, right of the usage block)</text>

  <!-- helper: each bar is 760 wide; x0=160; usage block 0..480, coord block 480..760 -->
  <!-- 1 running full -->
  <text x="16" y="66" class="lbl">running, full</text>
  <g transform="translate(160,50)"><rect class="bg" width="760" height="28"/><line class="bd" x1="0" y1="0.5" x2="760" y2="0.5"/>
    <text x="14" y="18" class="m">This computer</text><text x="110" y="18" class="m">main</text><text x="160" y="18" class="m">6 agents</text>
    <text x="330" y="18" class="d">Limits</text><text x="372" y="18" class="fg">Claude</text><text x="414" y="18" class="d">43% +2</text>
    <g transform="translate(490,0)"><rect x="0" y="1" width="262" height="26" rx="3" fill="none"/>
      <use href="#run" x="8" y="7" width="13" height="13" class="acc"/>
      <text x="28" y="18" class="m">3 running</text><text x="86" y="18" class="d">·</text><text x="96" y="18" fill="#ef5350">1 needs you</text><text x="164" y="18" class="d">·</text><text x="174" y="18" class="m">2 retained</text></g></g>

  <!-- 2 running dots tier (width 150) -->
  <text x="16" y="110" class="lbl">running, dots tier</text>
  <g transform="translate(160,94)"><rect class="bg" width="760" height="28"/><line class="bd" x1="0" y1="0.5" x2="760" y2="0.5"/>
    <text x="14" y="18" class="m">This computer</text><text x="330" y="18" class="d">Limits</text><text x="372" y="18" class="fg">Claude</text><text x="414" y="18" class="d">43% +2</text>
    <g transform="translate(490,0)">
      <use href="#run" x="8" y="7" width="13" height="13" class="acc"/>
      <circle cx="34" cy="14" r="3" fill="#d9a441"/><text x="41" y="18" class="m">3</text>
      <circle cx="62" cy="14" r="3" fill="#ef5350"/><text x="69" y="18" class="m">1</text>
      <circle cx="90" cy="14" r="3" fill="#8b8f95"/><text x="97" y="18" class="m">2</text></g></g>
  <text x="680" y="110" class="note">(block resized to ~150 px, or counts wider)</text>

  <!-- 3 running icon only -->
  <text x="16" y="154" class="lbl">running, icon tier</text>
  <g transform="translate(160,138)"><rect class="bg" width="760" height="28"/><line class="bd" x1="0" y1="0.5" x2="760" y2="0.5"/>
    <g transform="translate(490,0)"><use href="#run" x="8" y="7" width="13" height="13" class="acc"/><circle cx="26" cy="9" r="3" fill="#ef5350"/></g></g>
  <text x="680" y="154" class="note">red dot = something needs you</text>

  <!-- 4 running, nothing to do -->
  <text x="16" y="198" class="lbl">running, no tasks</text>
  <g transform="translate(160,182)"><rect class="bg" width="760" height="28"/><line class="bd" x1="0" y1="0.5" x2="760" y2="0.5"/>
    <g transform="translate(490,0)"><use href="#run" x="8" y="7" width="13" height="13" class="acc"/><text x="28" y="18" class="d">No tasks</text></g></g>

  <!-- 5 not running -->
  <text x="16" y="242" class="lbl">not running</text>
  <g transform="translate(160,226)"><rect class="bg" width="760" height="28"/><line class="bd" x1="0" y1="0.5" x2="760" y2="0.5"/>
    <g transform="translate(490,0)"><use href="#off" x="8" y="7" width="13" height="13" class="dim"/><text x="28" y="18" class="d">Coordinator off</text></g></g>
  <text x="680" y="242" class="note">click: coord up</text>

  <!-- 6 degraded -->
  <text x="16" y="286" class="lbl">degraded</text>
  <g transform="translate(160,270)"><rect class="bg" width="760" height="28"/><line class="bd" x1="0" y1="0.5" x2="760" y2="0.5"/>
    <g transform="translate(490,0)"><use href="#deg" x="8" y="7" width="13" height="13" class="wrk"/><text x="28" y="18" fill="#d9a441">Degraded</text><text x="84" y="18" class="d">· watcher stalled</text></g></g>
  <text x="680" y="286" class="note">click: coord up</text>

  <!-- 7 starting -->
  <text x="16" y="330" class="lbl">starting (up running)</text>
  <g transform="translate(160,314)"><rect class="bg" width="760" height="28"/><line class="bd" x1="0" y1="0.5" x2="760" y2="0.5"/>
    <g transform="translate(490,0)"><use href="#spin" x="8" y="7" width="13" height="13" class="dim"/><text x="28" y="18" class="d">Starting…</text></g></g>
  <text x="680" y="330" class="note">icon spins; click ignored</text>

  <!-- 8 loading -->
  <text x="16" y="374" class="lbl">loading (first read)</text>
  <g transform="translate(160,358)"><rect class="bg" width="760" height="28"/><line class="bd" x1="0" y1="0.5" x2="760" y2="0.5"/>
    <g transform="translate(490,0)"><use href="#off" x="8" y="7" width="13" height="13" class="dim"/><text x="28" y="18" class="d">Coordinator …</text></g></g>

  <!-- 9 unavailable -->
  <text x="16" y="418" class="lbl">status unreadable</text>
  <g transform="translate(160,402)"><rect class="bg" width="760" height="28"/><line class="bd" x1="0" y1="0.5" x2="760" y2="0.5"/>
    <g transform="translate(490,0)"><use href="#off" x="8" y="7" width="13" height="13" class="dim"/><text x="28" y="18" class="d">Coordinator unavailable</text></g></g>
  <text x="680" y="418" class="note">click: retry read</text>

  <!-- 10 focused + hover -->
  <text x="16" y="462" class="lbl">keyboard focus</text>
  <g transform="translate(160,446)"><rect class="bg" width="760" height="28"/><line class="bd" x1="0" y1="0.5" x2="760" y2="0.5"/>
    <g transform="translate(490,0)"><rect x="2" y="1" width="262" height="26" rx="3" fill="none" stroke="#3b82f6"/>
      <use href="#run" x="10" y="7" width="13" height="13" class="acc"/>
      <text x="30" y="18" class="m">3 running</text><text x="88" y="18" class="d">·</text><text x="98" y="18" fill="#ef5350">1 needs you</text></g></g>
  <text x="680" y="462" class="note">accent border, like usage</text>

  <!-- 11 tooltip -->
  <text x="16" y="506" class="lbl">hover tooltip</text>
  <g transform="translate(160,490)"><rect class="bg" width="760" height="28"/><line class="bd" x1="0" y1="0.5" x2="760" y2="0.5"/>
    <g transform="translate(490,0)"><rect x="0" y="1" width="262" height="26" rx="3" fill="#ffffff14"/><use href="#run" x="8" y="7" width="13" height="13" class="acc"/><text x="28" y="18" class="m">3 running</text></g>
    <g transform="translate(330,-48)"><rect width="420" height="38" rx="4" fill="#202225" stroke="#25282c"/><text x="10" y="16" class="fg">Coordinator running. 3 tasks running, 1 needs you, 2 retained.</text><text x="10" y="31" class="d">Click to open the board. Right-click also opens it.</text></g></g>
</svg>
