<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640" font-family="system-ui, 'Geist', sans-serif" font-size="12">
  <!-- Illustrative colours. Real build: popover, border, hover, selected, foreground, muted, dim, accent, working, blocked, done, idle. -->
  <style>
    .fg{fill:#e8e9eb}.m{fill:#a9adb3}.d{fill:#8b8f95}.b{fill:#ef5350}.w{fill:#d9a441}.a{fill:#3b82f6}.dn{fill:#4aa3df}
    .h{font-size:11px;font-weight:600;letter-spacing:.06em;fill:#a9adb3}
    .line{stroke:#25282c}.sm{font-size:11px}
    .btn{fill:none;stroke:#3b82f6}.btn2{fill:none;stroke:#3a3d42}
    .semi{font-weight:600}
  </style>
  <rect width="800" height="640" fill="#2b2d31"/>
  <rect x="20" y="20" width="760" height="600" rx="8" fill="#17191c" stroke="#25282c"/>

  <!-- header -->
  <text x="38" y="52" class="fg semi" font-size="15">Coordinator</text>
  <g transform="translate(140,36)"><rect width="64" height="26" rx="4" fill="#202225"/><text x="12" y="17" class="fg">Board</text>
    <rect x="68" width="84" height="26" rx="4" fill="none"/><text x="82" y="17" class="m">Timeline</text></g>
  <rect x="612" y="36" width="100" height="26" rx="4" class="btn2"/><text x="624" y="53" class="fg sm">Show coordinator</text>
  <rect x="722" y="36" width="44" height="26" rx="4" class="btn2"/><text x="732" y="53" class="fg">Close</text>
  <circle cx="548" cy="49" r="4" class="a"/><text x="558" y="53" class="m">Running</text>
  <text x="38" y="78" class="d sm">Watcher alive · heartbeat 4s ago · release a1b2c3d · coordinator working · updated 14:07:41</text>
  <line class="line" x1="20" y1="90" x2="780" y2="90"/>

  <!-- needs you -->
  <text x="38" y="112" class="h">NEEDS YOU · 2</text>
  <g transform="translate(26,120)">
    <rect width="748" height="52" rx="5" fill="#202225"/>
    <text x="14" y="20" class="b">?</text>
    <text x="32" y="20" class="fg">Should the fix also bump the lockfile, or leave it alone?</text>
    <text x="32" y="38" class="d sm">Fix login flow · ws-k3m2ab-t1 · asked by coordinator</text>
    <text x="640" y="20" class="m" text-anchor="end">12m</text>
    <rect x="560" y="26" width="168" height="20" rx="4" class="btn"/><text x="574" y="40" class="fg sm">Reply in coordinator</text>
    <rect x="560" y="26" width="0" height="0" fill="none"/>
  </g>
  <g transform="translate(26,178)">
    <rect width="748" height="36" rx="5" fill="none"/>
    <circle cx="18" cy="18" r="4" class="b"/>
    <text x="32" y="16" class="fg">Blocked: migration needs a decision on the schema</text>
    <text x="32" y="30" class="d sm">Billing export · ws-q9w4zx-t2 · coord-deep</text>
    <text x="728" y="16" class="m" text-anchor="end">41m</text>
  </g>
  <line class="line" x1="20" y1="222" x2="780" y2="222"/>

  <!-- workstreams -->
  <text x="38" y="244" class="h">WORKSTREAMS · 2</text>
  <g transform="translate(26,252)">
    <text x="12" y="18" class="m">▾</text>
    <text x="30" y="18" class="fg semi">Fix login flow</text>
    <text x="150" y="18" class="d sm">ws-k3m2ab · herdr-kit → main · 3 tasks</text>
    <text x="728" y="18" class="m" text-anchor="end">open · 2h 10m</text>

    <!-- task rows -->
    <g transform="translate(0,28)">
      <rect width="748" height="44" rx="5" fill="#ffffff0d" stroke="#3b82f6"/>
      <circle cx="40" cy="15" r="4" class="b"/><text x="52" y="19" class="b sm">asking</text>
      <text x="118" y="19" class="fg">Reproduce the login failure</text>
      <text x="456" y="19" class="m sm">coord-default</text><text x="728" y="19" class="m" text-anchor="end">12m</text>
      <text x="52" y="35" class="d sm">ws-k3m2ab-t1 · rung 2 same space — follow-up of the repro tab, same files</text>
      <rect x="520" y="22" width="52" height="18" rx="4" class="btn"/><text x="530" y="35" class="fg sm">Show</text>
      <rect x="578" y="22" width="48" height="18" rx="4" class="btn2"/><text x="587" y="35" class="fg sm">Peek</text>
      <rect x="632" y="22" width="40" height="18" rx="4" class="btn2"/><text x="641" y="35" class="fg sm">Log</text>
    </g>
    <g transform="translate(0,76)">
      <circle cx="40" cy="15" r="4" class="w"/><text x="52" y="19" class="w sm">running</text>
      <text x="118" y="19" class="fg">Patch session refresh</text>
      <text x="456" y="19" class="m sm">coord-deep</text><text x="728" y="19" class="m" text-anchor="end">34m</text>
      <text x="52" y="35" class="d sm">ws-k3m2ab-t2 · rung 4 new worktree — conflicting edits in auth/session.rs</text>
    </g>
    <g transform="translate(0,124)">
      <circle cx="40" cy="15" r="4" class="dn"/><text x="52" y="19" class="dn sm">done</text>
      <text x="118" y="19" class="fg">Write regression test</text>
      <text x="456" y="19" class="m sm">coord-light</text><text x="728" y="19" class="m" text-anchor="end">3m</text>
      <text x="52" y="35" class="d sm">ws-k3m2ab-t3 · rung 1 same session — resumed t1 session</text>
    </g>
    <text x="52" y="184" class="d sm">▸ 2 closed tasks</text>
  </g>

  <g transform="translate(26,448)">
    <text x="12" y="18" class="m">▸</text>
    <text x="30" y="18" class="fg semi">Billing export</text>
    <text x="150" y="18" class="d sm">ws-q9w4zx · billing-svc → release/7 · 1 task</text>
    <text x="728" y="18" class="m" text-anchor="end">open · 5h 02m</text>
  </g>
  <line class="line" x1="20" y1="486" x2="780" y2="486"/>

  <!-- retained -->
  <text x="38" y="508" class="h">RETAINED · 1</text>
  <g transform="translate(26,516)">
    <text x="12" y="18" class="m">◼</text>
    <text x="30" y="18" class="fg semi">Docs refresh</text>
    <text x="130" y="18" class="d sm">ws-7hn2cd · handbook → main</text>
    <text x="728" y="18" class="m" text-anchor="end">retained 1d 3h</text>
    <text x="30" y="36" class="w sm">Worktree has uncommitted files (3) — cleared automatically once they are committed or removed.</text>
    <text x="30" y="52" class="d sm">Last checked 2m ago</text>
    <rect x="560" y="40" width="80" height="18" rx="4" class="btn2"/><text x="570" y="53" class="fg sm">Show space</text>
    <rect x="646" y="40" width="40" height="18" rx="4" class="btn2"/><text x="656" y="53" class="fg sm">Log</text>
  </g>
  <!-- scrollbar -->
  <rect x="772" y="100" width="4" height="260" rx="2" fill="#ffffff22"/>
  <text x="38" y="606" class="d sm">↑↓ select · Enter show · → details · p peek · l log · t timeline · r refresh · Esc close</text>
</svg>
