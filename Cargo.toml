[package]
name = "herdr-kit"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A local Rust toolkit and native Herdr layout/mod suite"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
sha2 = "0.10"
tempfile = "3"
rustix = { version = "1", features = ["fs", "process"] }
tokio = { version = "1", features = ["rt", "macros", "time", "process", "io-util"] }

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"
