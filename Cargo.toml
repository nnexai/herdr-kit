[workspace]
members = ["crates/kit-core", "crates/kit-manager", "crates/kit-coord", "crates/kit-usage"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
kit-core = { path = "crates/kit-core" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
sha2 = "0.10"
tempfile = "3"
rustix = { version = "1", features = ["fs", "process"] }
tokio = { version = "1", features = ["rt", "macros", "time", "process", "io-util"] }

[workspace.lints.rust]
unsafe_code = "forbid"
