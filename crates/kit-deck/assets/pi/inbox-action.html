<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Inbox Action Settings</title>
  <style>
    body { margin: 12px; background: #141821; color: #e5eefc; font: 12px/1.4 system-ui, sans-serif; }
    .field { margin-bottom: 10px; }
    label { display: block; color: #94a3b8; margin-bottom: 4px; font-weight: 600; }
    select { width: 100%; box-sizing: border-box; padding: 6px 8px; border-radius: 6px; border: 1px solid #2a3448; background: #0b1020; color: #e5eefc; }
    .hint { color: #64748b; font-size: 11px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="field">
    <label for="mode">Action Mode</label>
    <select id="mode" data-setting="mode" data-default="next">
      <option value="next">Next Inbox Item</option>
      <option value="prev">Previous Inbox Item</option>
      <option value="focus">Focus Active Inbox Terminal</option>
      <option value="reply_1">Quick Reply Option #1 (hold 0.65s)</option>
      <option value="reply_2">Quick Reply Option #2 (hold 0.65s)</option>
    </select>
  </div>
  <div class="hint">Quick replies require holding for 0.65s before calling kit-coord say so accidental taps never send answers.</div>
  <script src="common.js"></script>
</body>
</html>
