<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Usage Limits Settings</title>
  <style>
    body { margin: 12px; background: #141821; color: #e5eefc; font: 12px/1.4 system-ui, sans-serif; }
    .field { margin-bottom: 10px; }
    label { display: block; color: #94a3b8; margin-bottom: 4px; font-weight: 600; }
    select { width: 100%; box-sizing: border-box; padding: 6px 8px; border-radius: 6px; border: 1px solid #2a3448; background: #0b1020; color: #e5eefc; }
    .hint { color: #64748b; font-size: 11px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="field">
    <label for="provider">Provider</label>
    <select id="provider" data-setting="provider" data-default="worst">
      <option value="worst">Worst Fresh Provider (auto)</option>
      <option value="codex">Codex</option>
      <option value="claude">Claude</option>
      <option value="copilot">Copilot</option>
      <option value="antigravity">Antigravity</option>
    </select>
  </div>
  <div class="hint">Tap selects the provider for Limit Bucket drill-down keys (or cycles when set to Worst). Hold forces a fresh usage check.</div>
  <script src="common.js"></script>
</body>
</html>
